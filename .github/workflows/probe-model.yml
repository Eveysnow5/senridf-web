name: Probe LLM Model

# 用一次真实调用探模型：能不能用、多快、推理占比、接不接受 enable_thinking:false。
#
# 存在的理由：2026-08-25 那天「换模型 / 加参数」失败了四次，每次都要走完
# push → 镜像 → 部署 → 作者手动点一次 → 读日志。四次里三次一次调用就能判掉。
# 这个 workflow 把验证成本从「一轮部署 + 一次用户点击」降到「20 秒」。
#
# ── 2026-09-04 起它还兼一个定时哨兵 ─────────────────────────────────────────
# 起因：2026-08-24 qwen3.8-max 的免费桶用尽，翻译/纪要/分析/校对/人生故事/
# 招标摘要/AI 情报/后台同步**同时 403**，而 **Actions 连报四周 success**，
# 最后是作者发现 AI 情报页停在 W31 才知道。中间三周各死一种，一次都没人知道。
#
# 所以每周探一次 TIERS 里的模型，并检查免费额度还剩几天。**两件事都要查**：
# 桶空了模型照样存在，只探"能不能答"永远是绿的。
#
# 定时的开销：`--from-tiers` 去重后 2 个模型 × 200 max_tokens，每周一次。
# ⚠️ 这是本仓库里唯一**允许**定时烧额度的 LLM workflow，因为它烧的量比它
# 能挡住的一次静默停服小几个数量级。别照着它给别的 workflow 加 schedule ——
# tests/workflow-injection.test.mjs 盯着另外两个。
#
# ⚠️ 绿灯**不等于线上没事**：这里用的是本仓库的 QWEN_API_KEY，而 Pages Functions
# 读的是同事 Cloudflare 项目里的那一份，我们改不了也看不到。两者是不是同一个
# 账号没有核实过。
on:
  schedule:
    # 每周一 07:00 JST（周日 22:00 UTC）—— 周一上班前就能看到 issue
    - cron: '0 22 * * 0'
  workflow_dispatch:
    inputs:
      models:
        description: '模型名，逗号分隔（留空＝探 TIERS 里的全部，并检查额度到期）'
        required: false
        type: string
      thinking_off:
        description: '传 enable_thinking:false（取消勾选＝不传，用来对比）'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  issues: write # 失败时开 issue —— 见下面那一步

jobs:
  probe:
    if: github.repository == 'sherlockafa007/senridoufuu-web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: scripts/ai-intel-scraper
        run: npm install
      - name: Probe
        id: probe
        working-directory: scripts/ai-intel-scraper
        # 输入走 env，不插进脚本文本 —— 见 tests/workflow-injection.test.mjs
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          MODELS: ${{ inputs.models }}
          THINKING_OFF: ${{ inputs.thinking_off }}
        run: |
          ARGS=""
          IFS=',' read -ra LIST <<< "$MODELS"
          for m in "${LIST[@]}"; do
            [ -z "$(echo "$m" | xargs)" ] && continue
            ARGS="$ARGS --model $(echo "$m" | xargs)"
          done
          # 没给模型名（定时触发就是这种）→ 从 TIERS 现取，并查额度到期。
          # ⚠️ 别在这里写死模型名：改了 TIERS 之后哨兵会一直绿着，
          #    而绿的是一个已经没人用的模型。
          if [ -z "$ARGS" ]; then ARGS="--from-tiers"; fi
          if [ "$THINKING_OFF" = "false" ]; then ARGS="$ARGS --no-thinking-off"; fi
          # 输出留一份给下面开 issue 用 —— 只写"失败了"的 issue 没人能据此行动
          set -o pipefail
          node probe-model.js $ARGS 2>&1 | tee "$RUNNER_TEMP/probe.log"

      # 失败要留下一个**人会看见**的东西。
      # 只让 job 变红不够：08-24 那次的教训正是"红了也没人看"——何况那次连红都没红。
      # issue 会发通知、会留在列表里、关掉之前一直在。
      - name: 失败就开 issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '(没拿到日志)';
            try {
              log = fs.readFileSync(process.env.RUNNER_TEMP + '/probe.log', 'utf8');
            } catch (e) {
              log = '(读日志失败：' + e.message + ')';
            }
            const TITLE = '🔴 LLM 额度哨兵报警';
            const body = [
              '`' + context.workflow + '` 在 ' + new Date().toISOString().slice(0, 16) + 'Z 失败。',
              '',
              '两种可能，处理方式不同：',
              '- **模型不可用**（退役 / 403 / 参数被拒）→ 换 `functions/api/_lib/models.js` 的 TIERS',
              '- **免费额度快到期** → 去百炼控制台「我的试用」找同家族、满额、到期更晚的模型，',
              '  换掉 TIERS **并同时更新 `TIER_EXPIRY`**（两处不同步的话哨兵会哑掉）',
              '',
              '⚠️ 这只说明**本仓库这份 key** 打不通了。Pages Functions 用的是同事 Cloudflare',
              '项目里的那份 key，换模型要她那边重新部署才生效。',
              '',
              '<details><summary>探测输出</summary>',
              '',
              '```',
              log.slice(0, 5000),
              '```',
              '',
              '</details>',
              '',
              '[这次运行](' + context.serverUrl + '/' + context.repo.owner + '/' +
                context.repo.repo + '/actions/runs/' + context.runId + ')',
            ].join('\n');

            // 已经有一个开着的就追评论，不要每周堆一个新 issue ——
            // 告警疲劳会让这套东西在真正出事那周被忽略掉。
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'llm-quota',
              per_page: 20,
            });
            const found = open.data.find((i) => i.title === TITLE);
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TITLE,
                body,
                labels: ['llm-quota'],
              });
            }
