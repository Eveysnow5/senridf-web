name: Mirror to deploy repo

# Runs in the SOURCE repo (sherlockafa007/senridoufuu-web) on every push to
# main and force-mirrors main into the deploy repo (Eveysnow5/senridf-web).
# The deploy repo's update fires the colleague's Cloudflare Pages build, so a
# push goes live with no manual "Sync fork".
#
# Setup: add a repository secret MIRROR_PAT = a fine-grained PAT scoped to
# Eveysnow5/senridf-web with "Contents: Read and write".
# Until that secret exists the job skips cleanly (no failure, no email).

on:
  push:
    branches: [main]
  workflow_dispatch:

# 一次后台操作（如发布一篇 blog）会连着产生多个提交，每个提交各触发一个 run。
# 没有并发组时它们会抢 refs/heads/main 的锁，后到的那个被拒：
#   ! [remote rejected] HEAD -> main (cannot lock ref 'refs/heads/main':
#     is at 27ca041 but expected ad48ce3)
# 2026-08-11 实际发生过（run #87，两次 push 相隔 1 秒）。
#
# 那次内容其实是对的——先跑的那个已经推上去了，失败的是冗余重复。但这种
# "无害的失败"恰恰危险：它会训练人忽略镜像失败邮件，而换一种交错顺序，
# 落后的就可能是真的镜像状态，站点静默变旧、唯一的信号正是那封被忽略的邮件。
#
# cancel-in-progress: true 而不是排队——镜像是幂等的、只有最终状态有意义，
# 被取代的 run 跑完也只是白推一次并多触发一次 Cloudflare 构建。顺带也消除了
# 下面 `ref: main` 注释里说的那个残余窗口（旧 run 在被取代前就被取消了）。
concurrency:
  group: mirror-to-deploy-repo
  cancel-in-progress: true

jobs:
  mirror:
    if: github.repository == 'sherlockafa007/senridoufuu-web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                    # always mirror main's CURRENT tip, not the commit that
                                        # triggered this run — a single admin action (e.g. blog
                                        # publish) can create several rapid commits, each firing
                                        # its own run; pinning to github.sha lets an older run
                                        # finish last and force-push a stale state, silently
                                        # erasing newer commits from the mirror.
          fetch-depth: 0
          persist-credentials: false   # don't let GITHUB_TOKEN's extraheader override the PAT
      - name: Force-push main to deploy repo
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
        run: |
          if [ -z "$MIRROR_PAT" ]; then
            echo "MIRROR_PAT not set — skipping mirror (set the secret to enable auto-deploy)."
            exit 0
          fi
          echo "Mirroring $(git rev-parse --short HEAD) to Eveysnow5/senridf-web ..."
          git push --force "https://x-access-token:${MIRROR_PAT}@github.com/Eveysnow5/senridf-web.git" HEAD:main
          echo "Done."
