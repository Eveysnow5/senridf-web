name: Rebuild AI Intel Digest

# 按周补建情报简报。只手动触发 —— 它会烧额度，不该有定时。
#
# 用途：2026-08 出现过 W32~W34 三周没生成简报（各因不同原因失败），
# 而条目大多已经入库。素材在、摘要没有，且下周跑的是下周的，洞不会自己长回来。
on:
  workflow_dispatch:
    inputs:
      weeks:
        description: '周次，逗号分隔（如 2026-W34 或 2026-W33,2026-W34）'
        required: true
        type: string
      apply:
        description: '真的写库（不勾选＝dry-run，只看会做什么）'
        required: false
        default: false
        type: boolean

jobs:
  rebuild:
    # 只在源仓库跑（有 secrets）。镜像副本里跳过、不失败、不发邮件。
    if: github.repository == 'sherlockafa007/senridoufuu-web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts/ai-intel-scraper
        run: npm install

      - name: Rebuild digest
        working-directory: scripts/ai-intel-scraper
        # ⚠️ 输入**不能**插进 run 的脚本文本里（`${{ inputs.x }}`）。
        # 2026-08-25 实测：作者误把上一次的整段日志粘进了输入框，那段文本直接把
        # shell 命令撑爆（punycode: command not found、最后 exit 127），
        # 脚本自己的周次格式校验根本没机会跑到。
        # 这也是 GitHub Actions 有名的脚本注入点 —— 输入里只要有引号或换行，
        # 就能跳出引号执行任意命令。走 env 传值，脚本里只引用变量名，
        # 内容永远不会被当成命令解析。
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          WEEKS: ${{ inputs.weeks }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            node rebuild-digest.js --weeks "$WEEKS" --apply
          else
            node rebuild-digest.js --weeks "$WEEKS"
          fi
