<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog 管理 · 千里同風</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #faf9f7; --paper: #fff; --border: #e8e2da;
      --text: #1f1c17; --text2: #6b6359; --text3: #9ca3af;
      --accent: #2563eb; --green: #10b981; --red: #ef4444;
    }
    body { font-family: 'Noto Sans SC', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Firebase login ── */
    #fb-login {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .fb-input {
      display: block; width: 100%; padding: 11px 14px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; font-family: inherit; outline: none;
      transition: border-color .15s; margin-bottom: 10px; background: var(--paper);
    }
    .fb-input:focus { border-color: var(--accent); }
    .fb-err { font-size: 13px; color: var(--red); min-height: 18px; margin-bottom: 10px; }

    /* ── Login card（Firebase 登录用） ── */
    .login-card {
      background: var(--paper); border: 1px solid var(--border); border-radius: 16px;
      padding: 48px 40px; max-width: 420px; width: 100%; text-align: center;
    }
    .login-logo { font-size: 28px; font-weight: 700; letter-spacing: .1em; margin-bottom: 6px; }
    .login-sub { font-size: 13px; color: var(--text3); margin-bottom: 32px; }
    .btn-primary {
      display: block; width: 100%; padding: 13px; background: var(--accent); color: #fff;
      border: none; border-radius: 10px; font-size: 15px; font-family: inherit;
      cursor: pointer; transition: opacity .15s;
    }
    .btn-primary:hover { opacity: .88; }
    .btn-primary:disabled { opacity: .5; cursor: default; }

    /* ── Editor ── */
    #editor { display: none; }
    .top-bar {
      position: sticky; top: 0; z-index: 50;
      background: var(--paper); border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 56px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .top-bar__right { display: flex; align-items: center; gap: 10px; }
    .top-bar__left { display: flex; align-items: center; gap: 18px; }
    .top-bar__logo { font-weight: 700; letter-spacing: .08em; color: var(--text); text-decoration: none; }
    .top-bar__nav { display: flex; gap: 14px; font-size: 13px; }
    .top-bar__nav-current { color: var(--accent); border-bottom: 2px solid var(--accent); padding: 4px 0; }
    .top-bar__nav-link { color: var(--text2); text-decoration: none; }
    .top-bar__nav-link:hover { color: var(--text); }
    .status { font-size: 12px; color: var(--text3); }
    .status.ok { color: var(--green); }
    .status.err { color: var(--red); }
    .btn-save {
      padding: 8px 20px; background: var(--accent); color: #fff; border: none;
      border-radius: 8px; font-size: 13px; font-family: inherit; cursor: pointer;
      transition: opacity .15s;
    }
    .btn-save:hover { opacity: .88; }
    .btn-save:disabled { opacity: .5; cursor: default; }
    .btn-link { background: none; border: none; font-size: 12px; color: var(--text3); cursor: pointer; }
    .btn-link:hover { color: var(--red); }
    .btn-sync {
      padding: 6px 14px; background: var(--accent); color: #fff; border: none;
      border-radius: 7px; font-size: 12px; font-family: inherit; cursor: pointer;
      transition: opacity .15s;
    }
    .btn-sync:hover { opacity: .88; }
    .btn-sync:disabled { opacity: .5; cursor: default; }
    .page-btn {
      padding: 12px 18px; font-size: 13px; font-family: inherit; background: none; border: none;
      border-bottom: 2px solid transparent; cursor: pointer; color: var(--text3);
      transition: color .15s, border-color .15s;
    }
    .page-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .page-btn:hover:not(.active) { color: var(--text2); }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 48px 0; color: var(--text3); font-size: 14px; }

    /* ── Blog view ── */
    .blog-toolbar { padding: 16px 24px; }
    .blog-list-row {
      display: flex; align-items: center; gap: 14px; padding: 12px 24px;
      border-bottom: 1px solid var(--border); font-size: 13px;
    }
    .blog-list-date { color: var(--text3); width: 90px; flex-shrink: 0; }
    .blog-list-title { flex: 1; }
    .blog-list-state { width: 150px; flex-shrink: 0; font-size: 12px; color: var(--text3); }
    .blog-list-state.draft { color: #b45309; }
    .blog-list-state.dirty { color: #2563eb; }
    .btn-link:disabled { opacity: 0.35; cursor: default; }
    .btn-link:disabled:hover { color: var(--text3); }

    /* ── 上架前预览弹窗：iframe 里是上架时要写进仓库的那份文章页 ── */
    .pv-modal { position: fixed; inset: 0; z-index: 1000; display: flex; padding: 24px; background: rgba(0, 0, 0, 0.45); }
    .pv-modal[hidden] { display: none; }
    .pv-box { flex: 1; display: flex; flex-direction: column; background: #fff; border-radius: 10px; overflow: hidden; }
    .pv-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 18px; border-bottom: 1px solid var(--border); }
    .pv-hint { margin-left: 10px; font-size: 12px; color: var(--text3); }
    .pv-actions { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    #pv-frame { flex: 1; width: 100%; border: 0; background: #fff; }

    #blog-compose { max-width: 900px; margin: 0 auto; padding: 24px; }
    .compose-row { margin-bottom: 16px; }
    .compose-label { display: block; font-size: 12px; color: var(--text3); margin-bottom: 5px; }
    .compose-input, .compose-textarea {
      width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 7px;
      font-size: 13px; font-family: inherit; background: var(--paper); color: var(--text);
      outline: none; resize: vertical;
    }
    .compose-input:focus, .compose-textarea:focus { border-color: var(--accent); }
    .compose-textarea { line-height: 1.7; }
    /* 编辑器工具栏（admin/blog/editor.js 生成）：吸顶，长文往下写时也够得着 */
    .compose-toolbar {
      position: sticky; top: 56px; z-index: 20; background: var(--bg);
      padding: 6px 0; margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    }
    .compose-toolbar button, .compose-toolbar select {
      padding: 4px 10px; border: 1px solid var(--border); border-radius: 5px;
      background: var(--paper); font-size: 12px; font-family: inherit; cursor: pointer; color: var(--text);
    }
    .compose-toolbar button:hover { border-color: var(--accent); }
    .ed-colors { display: inline-flex; gap: 4px; align-items: center; padding: 0 4px; }
    .compose-toolbar .ed-swatch {
      width: 20px; height: 20px; padding: 0; border-radius: 50%; border: 1px solid var(--border);
      color: #fff; font-size: 11px; line-height: 18px;
    }
    .ed-colors input[type="color"] { width: 26px; height: 22px; padding: 0; border: none; background: none; cursor: pointer; }
    /* 编辑区：iframe 里是和文章页同一份样式（admin/blog/frame.html），高度随内容伸展 */
    .ed-frame { display: block; width: 100%; height: 420px; border: 1px solid var(--border); border-radius: 7px; background: #F8F8F5; }
    .ed-frame[hidden] { display: none; }
    .compose-date { width: auto; }
    .compose-tags { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .compose-hint { font-size: 12px; color: var(--text3); margin-top: 4px; }
    .status.warn { color: #b45309; }
    .compose-cover-preview {
      max-width: 200px; border-radius: 6px; margin-top: 8px; display: none;
    }
    .lang-tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  </style>
  <link rel="stylesheet" href="/css/admin-header.css">
  <!-- 与文章页（workers/sdf-admin/src/blog.js 的模板）同版本同 SRI：编辑器载入旧 Markdown 稿、保存时过滤，
       都要和文章页渲染用同一个库，否则「看到的」和「发布后的」可能不同 -->
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js" integrity="sha384-a7SzOxErzJ3ZpQz0zJ32d67dSitNzPcbfybc/ykU9KJhMgZkwqfSxlhhdJRS+XGL" crossorigin="anonymous"></script>


  <!-- head-meta:start（npm run meta 生成，勿手改） -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- head-meta:end -->
</head>
<body>

<!-- ══ Firebase Login ════════════════════════════════════════════════ -->
<div id="fb-login">
  <div class="login-card">
    <div class="login-logo">千里同風</div>
    <div class="login-sub">Blog 管理</div>
    <input id="fb-email" type="email" class="fb-input" placeholder="邮箱地址" autocomplete="email">
    <input id="fb-password" type="password" class="fb-input" placeholder="密码" autocomplete="current-password">
    <div id="fb-err" class="fb-err"></div>
    <button type="button" class="btn-primary" id="fb-login-btn" onclick="fbLogin()">登录</button>
  </div>
</div>

<!-- ══ Editor ═════════════════════════════════════════════════════════ -->
<div id="editor">
  <div class="top-bar">
    <div class="top-bar__left">
      <a href="/" class="top-bar__logo" title="返回网站主页">千里同風</a>
      <nav class="top-bar__nav">
        <a href="/admin/" class="top-bar__nav-link">网站内容</a>
        <span class="top-bar__nav-current">Blog</span>
        <a href="/solutions/demo/admin.html" class="top-bar__nav-link">运行监控</a>
        <a href="/admin/macro.html" class="top-bar__nav-link">宏观对表</a>
      <a href="/admin/accounting.html" class="top-bar__nav-link">自动化结账</a>
      </nav>
    </div>
    <div class="top-bar__right">
      <button type="button" class="btn-link" onclick="fbLogout()">退出登录</button>
    </div>
  </div>

  <div class="blog-toolbar">
    <button type="button" class="btn-save" onclick="startNewPost()">+ 写新文章</button>
    <!-- 自动保存的草稿（含已发布过的那一份）。发布后又下架的文章，从这里接着改 -->
    <button type="button" class="btn-link" onclick="restoreDraft()" title="载入最近一次自动保存的稿子">载入上次的稿子</button>
    <span id="blog-deploy-status" class="status"></span>
  </div>
  <div id="blog-list"></div>

  <div id="blog-compose" hidden>
    <div class="compose-row">
      <label class="compose-label" for="compose-tag">标签（可留空；填了就要中・日・英三种都有，「一键同步日英」会一起翻）</label>
      <!-- 2026-10-22 不设下拉、手工输入；2026-10-24 改成三语（英文页出现过中文标签） -->
      <div class="compose-tags">
        <input type="text" id="compose-tag" class="compose-input" maxlength="40"
          placeholder="中文，例如：思考" oninput="onComposeInput()">
        <input type="text" id="compose-tag-ja" class="compose-input" maxlength="40"
          placeholder="日本語" title="标签（日本語）" oninput="onComposeInput()">
        <input type="text" id="compose-tag-en" class="compose-input" maxlength="40"
          placeholder="English" title="标签（English）" oninput="onComposeInput()">
      </div>
    </div>
    <div class="compose-row">
      <label class="compose-label" for="compose-date">发布日期</label>
      <input type="date" id="compose-date" class="compose-input compose-date" oninput="onComposeInput()">
      <div class="compose-hint">默认今天。补发旧文章时改成当时的日期，文章页显示这个日期，列表也按它排序。不能选未来的日子（选了也会马上公开，不是定时发布）。</div>
    </div>
    <div class="compose-row">
      <label class="compose-label">封面图（可选）</label>
      <input type="file" id="compose-cover-file" accept="image/*" onchange="handleCoverFile(this.files[0])">
      <img id="compose-cover-preview" class="compose-cover-preview" alt="">
    </div>
    <div class="compose-row">
      <label class="compose-label">标题（中文）</label>
      <input type="text" id="compose-title-zh" class="compose-input" oninput="onComposeInput()">
    </div>
    <div class="compose-row">
      <label class="compose-label">正文（中文）</label>
      <div class="compose-toolbar" id="toolbar-zh"></div>
      <input type="file" id="compose-inline-image-file" accept="image/*" style="display:none" onchange="handleInlineImageFile(this.files[0])">
      <!-- 编辑区就是发布后的样子：同一份样式、同一组字体、同一套过滤（见 admin/blog/frame.html） -->
      <iframe id="ed-zh" class="ed-frame" src="/admin/blog/frame.html" title="中文正文编辑区"></iframe>
      <div class="compose-hint">选中文字后点工具栏改字体・字号・颜色。粘贴进来的内容按纯文本处理（格式用工具栏加）。</div>
    </div>
    <div class="compose-row">
      <button type="button" class="btn-sync" id="compose-sync-btn" onclick="syncBlogTranslate()">✨ 一键同步日英</button>
      <span id="compose-sync-status" class="status"></span>
    </div>
    <div class="lang-tabs">
      <button type="button" class="page-btn active" data-other-lang="ja" onclick="switchComposeOtherLang('ja')">日本語</button>
      <button type="button" class="page-btn" data-other-lang="en" onclick="switchComposeOtherLang('en')">English</button>
    </div>
    <div class="compose-row">
      <label class="compose-label" id="other-lang-title-label">标题（日本語）</label>
      <input type="text" id="compose-title-other" class="compose-input" oninput="onComposeInput()">
    </div>
    <div class="compose-row">
      <label class="compose-label" id="other-lang-body-label">正文（日本語）</label>
      <div class="compose-toolbar" id="toolbar-other"></div>
      <iframe id="ed-ja" class="ed-frame" src="/admin/blog/frame.html" title="日文正文编辑区"></iframe>
      <iframe id="ed-en" class="ed-frame" src="/admin/blog/frame.html" title="英文正文编辑区" hidden></iframe>
    </div>
    <div class="compose-row">
      <button type="button" class="btn-save" onclick="finishPost()" title="存进草稿箱；回到列表点「上架」后网站上才看得到">完成</button>
      <button type="button" class="btn-link" onclick="cancelCompose()">取消</button>
      <span id="compose-publish-status" class="status"></span>
      <span id="draft-status" class="status"></span>
    </div>
  </div>
</div>

<div id="pv-modal" class="pv-modal" hidden>
  <div class="pv-box" role="dialog" aria-modal="true" aria-labelledby="pv-title">
    <div class="pv-head">
      <div>
        <strong id="pv-title">上架前预览</strong>
        <span class="pv-hint">和网站上的样子完全一致，这里不能修改。页面顶部可以切换日・中・英。</span>
      </div>
      <div class="pv-actions">
        <button type="button" class="btn-link" id="pv-cancel">取消，回去修改</button>
        <button type="button" class="btn-save" id="pv-ok">确定上架</button>
      </div>
    </div>
    <iframe id="pv-frame" title="上架前预览" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>
</div>

<script>
let blogPosts = [];
let composeState = null; // null = 未在撰写；对象 = 正在写/编辑
let composeOtherLang = 'ja';
let draftSaveTimer = null;

function escapeHtmlAdmin(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ── 撰写面板 ── */
// 本机日期（日本时间）。toISOString 是 UTC，早上 9 点前会变成昨天。
function localToday() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function startNewPost() {
  composeState = {
    docId: null, // 草稿箱文档 id，第一次「完成」时生成
    slug: null,
    tag: { zh: '', ja: '', en: '' },
    date: localToday(),
    cover: null,
    coverChanged: false,
    title: { zh: '', ja: '', en: '' },
    body: { zh: '', ja: '', en: '' },
  };
  composeOtherLang = 'ja';
  renderCompose();
  document.getElementById('blog-compose').hidden = false;
}

function renderCompose() {
  // 标签：三语三个框（composeState.tag 一律是 {zh, ja, en}，载入时由 tagObject 统一）
  document.getElementById('compose-tag').value = composeState.tag.zh;
  document.getElementById('compose-tag-ja').value = composeState.tag.ja;
  document.getElementById('compose-tag-en').value = composeState.tag.en;
  const dateEl = document.getElementById('compose-date');
  dateEl.max = localToday();
  dateEl.value = composeState.date;
  document.getElementById('compose-title-zh').value = composeState.title.zh;
  const preview = document.getElementById('compose-cover-preview');
  if (composeState.cover) {
    preview.src = composeState.cover.startsWith('data:') ? composeState.cover : '/' + composeState.cover;
    preview.style.display = 'block';
  } else {
    preview.style.display = 'none';
  }
  renderOtherLangFields();
  // 正文写进三个编辑区（旧的 Markdown 稿在这里自动转成带格式的内容）
  for (const l of ['zh', 'ja', 'en']) window.sdfBlogEd.setBody(l, composeState.body[l]);
}

function renderOtherLangFields() {
  const langLabel = composeOtherLang === 'ja' ? '日本語' : 'English';
  document.getElementById('other-lang-title-label').textContent = `标题（${langLabel}）`;
  document.getElementById('other-lang-body-label').textContent = `正文（${langLabel}）`;
  document.getElementById('compose-title-other').value = composeState.title[composeOtherLang];
  document.getElementById('ed-ja').hidden = composeOtherLang !== 'ja';
  document.getElementById('ed-en').hidden = composeOtherLang !== 'en';
  document.querySelectorAll('.lang-tabs .page-btn').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.otherLang === composeOtherLang);
  });
}

function switchComposeOtherLang(lang) {
  composeOtherLang = lang;
  renderOtherLangFields();
}

// 标签・标题变化时同步进 composeState，并安排一次草稿自动保存。
// 正文不在这里读：编辑区有变化时由编辑器回调 onBodyChange 单独写回（见下方 module），
// 免得编辑区还没载入完时把正文读成空、覆盖掉稿子。
function onComposeInput() {
  if (!composeState) return;
  composeState.tag = {
    zh: document.getElementById('compose-tag').value.trim(),
    ja: document.getElementById('compose-tag-ja').value.trim(),
    en: document.getElementById('compose-tag-en').value.trim(),
  };
  // 日期框没填完整时 value 是空串；那时保留原来的日期，发布前再检查
  const dateVal = document.getElementById('compose-date').value;
  if (dateVal) composeState.date = dateVal;
  composeState.title.zh = document.getElementById('compose-title-zh').value;
  composeState.title[composeOtherLang] = document.getElementById('compose-title-other').value;
  scheduleDraftSave();
}

function onBodyChange(lang) {
  if (!composeState) return;
  composeState.body[lang] = window.sdfBlogEd.getBody(lang);
  scheduleDraftSave();
}

function cancelCompose() {
  composeState = null;
  document.getElementById('blog-compose').hidden = true;
  clearTimeout(draftSaveTimer);
}

function scheduleDraftSave() {
  clearTimeout(draftSaveTimer);
  draftSaveTimer = setTimeout(() => saveDraft(), 2000);
}

const MAX_IMAGE_BYTES = 1_000_000;

/* ── 压缩图片：canvas 转 WebP，超限自动降质重试，保持原始宽高比不拉伸。
   onSuccess(dataUrl) / onError(message) 两个回调，失败时不吞错误。 ── */
function compressImageToWebp(file, maxBytes, onSuccess, onError) {
  const reader = new FileReader();
  reader.onerror = () => onError('图片读取失败，请重试');
  reader.onload = (e) => {
    const img = new Image();
    img.onerror = () => onError('图片格式无法识别，请更换文件');
    img.onload = () => {
      const MAX_SIDE = 1600;
      let { width, height } = img;
      if (width > MAX_SIDE || height > MAX_SIDE) {
        const ratio = Math.min(MAX_SIDE / width, MAX_SIDE / height);
        width = Math.round(width * ratio);
        height = Math.round(height * ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      let quality = 0.85;
      let dataUrl = canvas.toDataURL('image/webp', quality);
      while (Math.floor((dataUrl.length * 3) / 4) > maxBytes && quality > 0.4) {
        quality -= 0.15;
        dataUrl = canvas.toDataURL('image/webp', quality);
      }
      if (Math.floor((dataUrl.length * 3) / 4) > maxBytes) {
        onError('图片过大，请更换');
        return;
      }
      onSuccess(dataUrl);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ── 封面图：选完立即压缩预览，随发布一起提交（沿用既有行为） ── */
function handleCoverFile(file) {
  if (!file) return;
  compressImageToWebp(
    file,
    MAX_IMAGE_BYTES,
    (dataUrl) => {
      composeState.cover = dataUrl;
      composeState.coverChanged = true;
      const preview = document.getElementById('compose-cover-preview');
      preview.src = dataUrl;
      preview.style.display = 'block';
      scheduleDraftSave();
    },
    (message) => alert(message),
  );
}

/* ── 正文插图：选完立即压缩并上传（方案A），成功后插进点「插图」时所在那个语言的编辑区光标处 ── */
let imageTargetLang = 'zh';
function insertImage(lang) {
  imageTargetLang = lang || 'zh';
  const input = document.getElementById('compose-inline-image-file');
  input.value = ''; // 同一张图连插两次也要触发 change
  input.click();
}

function handleInlineImageFile(file) {
  if (!file) return;
  compressImageToWebp(
    file,
    MAX_IMAGE_BYTES,
    (dataUrl) => window.uploadInlineImage(dataUrl, imageTargetLang),
    (message) => alert(message),
  );
}
</script>

<script type="module">
import { auth, db } from '/js/shared/firebase-init.js?v=56a6fa4390';
import { initErrorReporting } from '/js/shared/report-error.js?v=e309b9f010';
import { isAdmin } from '/js/shared/admins.js?v=4e0c5c325f';
import { pollDeployStatus } from '/js/shared/deploy-poll.js?v=b8f00c7191';
import { loginErrorText } from '/js/shared/auth-errors.js?v=5b0d8d515b';
import { onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { doc, setDoc, getDoc, getDocs, collection, query, where, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import {
  mergeRows, rowActions, rowStatus, publishProblem, newDocId, docIdForSlug, previewDoc,
} from '/js/shared/blog-posts-model.js?v=2b8492a417';
import { tagObject } from '/js/shared/blog-tags.js?v=2d02e3ed50';
import * as ed from '/admin/blog/editor.js?v=f761ce1889';

initErrorReporting({ db });

// 所见即所得编辑器：中文一个、日英各一个（同一时间只显示其一），各自一条工具栏
window.sdfBlogEd = ed;
ed.init(
  {
    zh: document.getElementById('ed-zh'),
    ja: document.getElementById('ed-ja'),
    en: document.getElementById('ed-en'),
  },
  (lang) => onBodyChange(lang),
);
ed.buildToolbar(document.getElementById('toolbar-zh'), () => 'zh', { onImage: insertImage });
ed.buildToolbar(document.getElementById('toolbar-other'), () => composeOtherLang, {
  onImage: insertImage,
});

/** 发布 / 翻译前把三个编辑区的正文读回 composeState（以编辑区为准）。 */
function readBodies() {
  for (const l of ['zh', 'ja', 'en']) composeState.body[l] = ed.getBody(l);
}

// 保存通道：站长自己 CF 账号下的 sdf-admin Worker（服务端持有 GitHub 令牌）
const WORKER_URL = 'https://sdf-admin.sherlockafa.workers.dev';

async function api(method, path, body) {
  const idToken = await auth.currentUser.getIdToken(); // SDK 自动续期
  const res = await fetch(WORKER_URL + path, {
    method,
    headers: {
      Authorization: `Bearer ${idToken}`,
      ...(body ? { 'Content-Type': 'application/json' } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch { /* 非 JSON 响应按状态码报错 */ }
  if (!res.ok) throw new Error(data.error || `请求失败（${res.status}）`);
  return data;
}

async function waitForDeploy(commitSha, statusEl) {
  statusEl.className = 'status'; statusEl.textContent = '✓ 已保存，上线前检查中…（约2-4分钟）';
  const r = await pollDeployStatus({
    fetchStatus: () => api('GET', `/deploy-status?sha=${commitSha}`),
    sleep: (ms) => new Promise((done) => setTimeout(done, ms)),
  });
  if (r.state === 'synced') {
    statusEl.className = 'status ok';
    statusEl.textContent = '✓ 已上线（如未见变化，等约1分钟后刷新网站）';
    return;
  }
  if (r.state === 'blocked') {
    // 2026-10-21 的 blog 发布就是这样：保存成功、检查没过、前台一直空白，而界面只说「还没上线」。
    statusEl.className = 'status err';
    statusEl.textContent = '已保存，但上线前的自动检查没通过，网站还是上一个版本。GitHub 已发邮件说明是哪一项；修好后会一起上线';
    if (r.runUrl) console.warn('没通过的那次检查：', r.runUrl);
    return;
  }
  if (r.state === 'no_permission') {
    statusEl.className = 'status warn';
    statusEl.textContent = '已保存；后台令牌还没有「Actions 只读」权限，查不了上线状态，请直接打开网站确认';
    return;
  }
  if (r.state === 'unreachable') {
    // 一次都没查到 ≠ 部署慢。说出原因，否则 CSP 拦截、限流、断网都长一样。
    statusEl.className = 'status err';
    statusEl.textContent = `已保存；但一次都没查到上线状态（${r.lastError?.message || '原因未知'}），请直接打开网站确认`;
    console.warn('上线状态查询全程失败，最后一次错误：', r.lastError);
    return;
  }
  statusEl.className = 'status warn';
  statusEl.textContent = '已保存；几分钟内还没跑完上线，稍后刷新网站确认';
}

// 列表 = 线上（posts.json）＋ 草稿箱（Firestore blog_drafts/p_*）。规则见 js/shared/blog-posts-model.js
let savedDocs = [];
let blogRows = [];

window.loadBlogPosts = async function () {
  const [{ posts }, snap] = await Promise.all([
    api('GET', '/blog/posts'),
    getDocs(query(collection(db, 'blog_drafts'), where('kind', '==', 'post'))),
  ]);
  blogPosts = posts || [];
  savedDocs = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  blogRows = mergeRows(blogPosts, savedDocs);
  renderBlogList();
};

function renderBlogList() {
  const listEl = document.getElementById('blog-list');
  if (blogRows.length === 0) {
    listEl.innerHTML = '<div class="empty">还没有文章</div>';
    return;
  }
  listEl.innerHTML = blogRows
    .map((r) => {
      const st = rowStatus(r);
      const act = rowActions(r);
      const k = escapeHtmlAdmin(r.key);
      return `
    <div class="blog-list-row">
      <span class="blog-list-date">${escapeHtmlAdmin(r.date)}</span>
      <span class="blog-list-title">${escapeHtmlAdmin(r.title || '（无标题）')}</span>
      <span class="blog-list-state ${st.cls}">${st.text}</span>
      <button type="button" class="btn-link" onclick="editPost('${k}')">编辑</button>
      <button type="button" class="btn-link" onclick="publishRow('${k}')" ${act.canPublish ? '' : 'disabled'}>上架</button>
      <button type="button" class="btn-link" onclick="unpublishRow('${k}')" ${act.canUnpublish ? '' : 'disabled'}>下架</button>
    </div>`;
    })
    .join('');
}

const contentOf = (row) =>
  row.docId ? savedDocs.find((d) => d.id === row.docId) : blogPosts.find((p) => p.slug === row.slug);

window.editPost = function (key) {
  const row = blogRows.find((r) => r.key === key);
  const src = row && contentOf(row);
  if (!src) return;
  composeState = {
    // 只在线上的旧文章：第一次「完成」时按 slug 在草稿箱建档
    docId: row.docId || docIdForSlug(row.slug),
    slug: src.slug || null,
    tag: tagObject(src.tag),
    date: src.date || localToday(),
    cover: src.cover || null,
    coverChanged: false,
    title: { zh: '', ja: '', en: '', ...(src.title || {}) },
    body: { zh: '', ja: '', en: '', ...(src.body || {}) },
  };
  composeOtherLang = 'ja';
  renderCompose();
  document.getElementById('blog-compose').hidden = false;
};

window.saveDraft = async function () {
  if (!composeState) return;
  const el = document.getElementById('draft-status');
  try {
    const { cover, coverChanged, ...rest } = composeState;
    await setDoc(doc(db, 'blog_drafts', 'current'), {
      ...rest,
      cover: cover && !cover.startsWith('data:') ? cover : null,
      published: false,
      updatedAt: serverTimestamp(),
    });
    if (el) {
      el.className = 'status';
      el.textContent = `草稿已存 ${new Date().toTimeString().slice(0, 5)}`;
    }
  } catch (err) {
    // 保存失败不打断撰写，但**必须让作者看见**：原先这里是空的，
    // 而自动保存成功时也没任何提示——于是"一直在存"和"一次都没存上"
    // 在界面上长得一模一样，直到浏览器崩了才发现什么都没恢复。
    console.warn('草稿自动保存失败：', err);
    if (el) {
      el.className = 'status err';
      el.textContent = '⚠ 草稿未能保存，请自行备份正文';
    }
  }
};

// 「载入上次的稿子」：不管有没有发布过，都把最近一次自动保存的稿子拿出来接着改。
// 为什么（2026-10-22）：发布后又下架的文章，草稿标成了「已发布」，checkDraft 不再提示，
// 后台也就找不回原文（只剩 git 历史）。
window.restoreDraft = async function () {
  try {
    const snap = await getDoc(doc(db, 'blog_drafts', 'current'));
    if (!snap.exists()) {
      alert('没有找到保存过的稿子');
      return;
    }
    const d = snap.data();
    const t = (d.title && d.title.zh) || '（无标题）';
    if (composeState && !confirm(`载入「${t}」会替换正在编辑的内容，继续吗？`)) return;
    fillFromDraft(d);
  } catch (err) {
    alert('读取稿子失败：' + err.message);
  }
};

function fillFromDraft(d) {
  composeState = {
    docId: d.docId || null,
    slug: d.slug || null,
    tag: tagObject(d.tag),
    date: d.date || localToday(),
    cover: d.cover || null,
    coverChanged: false,
    title: { zh: '', ja: '', en: '', ...(d.title || {}) },
    body: { zh: '', ja: '', en: '', ...(d.body || {}) },
  };
  composeOtherLang = 'ja';
  renderCompose();
  document.getElementById('blog-compose').hidden = false;
}

window.checkDraft = async function () {
  try {
    const snap = await getDoc(doc(db, 'blog_drafts', 'current'));
    if (!snap.exists() || snap.data().published !== false) return;
    const d = snap.data();
    if (!confirm('检测到上次没点「完成」的稿子，是否恢复？')) return;
    fillFromDraft(d);
  } catch (err) {
    // 不阻塞正常使用，但要留痕：读不到草稿和“本来就没草稿”在界面上无法区分。
    console.warn('草稿读取失败：', err);
  }
};

window.syncBlogTranslate = async function () {
  onComposeInput();
  readBodies();
  const btn = document.getElementById('compose-sync-btn');
  const statusEl = document.getElementById('compose-sync-status');
  if (!composeState.body.zh) {
    statusEl.className = 'status err';
    statusEl.textContent = '中文正文是空的';
    return;
  }
  btn.disabled = true;
  btn.textContent = '同步中…（长文约 1 分钟）';
  statusEl.className = 'status';
  statusEl.textContent = '';
  try {
    const result = await api('POST', '/translate', {
      fields: [
        { key: 'title', zh: composeState.title.zh },
        { key: 'body', zh: composeState.body.zh },
        ...(composeState.tag.zh ? [{ key: 'tag', zh: composeState.tag.zh }] : []),
      ],
    });
    if (result.ja?.title) composeState.title.ja = result.ja.title;
    if (result.en?.title) composeState.title.en = result.en.title;
    if (result.ja?.tag) composeState.tag.ja = result.ja.tag.trim();
    if (result.en?.tag) composeState.tag.en = result.en.tag.trim();
    document.getElementById('compose-tag-ja').value = composeState.tag.ja;
    document.getElementById('compose-tag-en').value = composeState.tag.en;
    const got = { ja: result.ja?.body || '', en: result.en?.body || '' };
    for (const l of ['ja', 'en']) {
      if (!got[l]) continue;
      await ed.setBody(l, got[l]);
      composeState.body[l] = ed.getBody(l);
    }
    renderOtherLangFields();
    // 译文的格式标签和中文对不上＝模型动了格式：说出来，让作者对照检查（不悄悄发布）
    const missing = ['ja', 'en'].filter((l) => !got[l]);
    const off = ed.formatMismatch(composeState.body.zh, composeState.body);
    const name = { ja: '日文', en: '英文' };
    if (missing.length) {
      statusEl.className = 'status err';
      statusEl.textContent = `${missing.map((l) => name[l]).join('、')}没有译出来，可重试`;
    } else if (off.length) {
      statusEl.className = 'status warn';
      statusEl.textContent = `✓ 已同步；但${off.map((l) => name[l]).join('、')}的格式（字体・颜色・标题等）和中文不完全一致，请对照检查`;
    } else {
      statusEl.className = 'status ok';
      statusEl.textContent = '✓ 已同步（格式与中文一致）';
    }
    scheduleDraftSave();
  } catch (e) {
    statusEl.className = 'status err';
    statusEl.textContent = '同步失败：' + e.message;
  }
  btn.disabled = false;
  btn.textContent = '✨ 一键同步日英';
};

window.uploadInlineImage = async function (dataUrl, lang = 'zh') {
  const statusEl = document.getElementById('compose-sync-status');
  statusEl.className = 'status';
  statusEl.textContent = '图片上传中…';
  let path;
  try {
    ({ path } = await api('POST', '/blog/image', { image: dataUrl }));
  } catch (e) {
    statusEl.className = 'status err';
    statusEl.textContent = '图片上传失败：' + e.message;
    return;
  }
  // 上传已经成功，插入光标这步理论上不会失败；即使真的抛错，也不该报成"上传失败"
  // 误导用户重传——上传和插入是两个独立的失败域，分开处理。
  ed.insertImage(lang, path);
  statusEl.textContent = '✓ 图片已插入';
};

// 「完成」＝存进草稿箱（Firestore），网站上看不到；回到列表点「上架」才公开（2026-10-24 作者要求）。
// 不要求三语齐全：草稿可以只写中文。三语检查在上架时做。
window.finishPost = async function () {
  onComposeInput();
  readBodies();
  clearTimeout(draftSaveTimer);
  const statusEl = document.getElementById('compose-publish-status');
  const date = document.getElementById('compose-date').value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
    statusEl.className = 'status err';
    statusEl.textContent = '✗ 发布日期没填完整';
    return;
  }
  composeState.date = date;
  statusEl.className = 'status';
  statusEl.textContent = '保存中…';
  try {
    // 新选的封面先传进仓库（和正文插图同一个接口），草稿箱里只存路径
    if (composeState.coverChanged && composeState.cover && composeState.cover.startsWith('data:')) {
      const { path } = await api('POST', '/blog/image', { image: composeState.cover });
      composeState.cover = path;
      composeState.coverChanged = false;
    }
    if (!composeState.docId) composeState.docId = newDocId();
    const { docId, coverChanged, ...post } = composeState;
    await setDoc(doc(db, 'blog_drafts', docId), {
      kind: 'post',
      ...post,
      dirty: true,
      updatedAt: serverTimestamp(),
    });
    await setDoc(
      doc(db, 'blog_drafts', 'current'),
      { published: true, docId, updatedAt: serverTimestamp() },
      { merge: true },
    );
    composeState = null;
    document.getElementById('blog-compose').hidden = true;
    statusEl.textContent = '';
    await loadBlogPosts();
    const listStatus = document.getElementById('blog-deploy-status');
    listStatus.className = 'status ok';
    listStatus.textContent = '✓ 已存进草稿箱。点这一行的「上架」后，网站上才看得到';
  } catch (e) {
    statusEl.className = 'status err';
    statusEl.textContent = '✗ 保存失败：' + e.message;
  }
};

window.publishRow = async function (key) {
  const row = blogRows.find((r) => r.key === key);
  if (!row || !row.docId || !rowActions(row).canPublish) return;
  const d = savedDocs.find((x) => x.id === row.docId);
  const statusEl = document.getElementById('blog-deploy-status');
  const problem = publishProblem(d, localToday());
  if (problem) {
    statusEl.className = 'status err';
    statusEl.textContent = `✗ 不能上架「${row.title || '（无标题）'}」：${problem}`;
    return;
  }
  const payload = { tag: d.tag || '', date: d.date, title: d.title, body: d.body };
  if (d.slug) payload.slug = d.slug;
  if (d.cover) payload.coverPath = d.cover;
  // 先看预览（2026-10-24 作者要求）：和上架同一份页面，确定了才真的上架
  statusEl.className = 'status';
  statusEl.textContent = '生成预览中…';
  let pv;
  try {
    pv = previewDoc((await api('POST', '/blog/preview', payload)).html);
  } catch (e) {
    statusEl.className = 'status err';
    statusEl.textContent = '✗ 预览生成失败，没有上架：' + e.message;
    return;
  }
  statusEl.textContent = '';
  if ((await showPreview(pv)) !== 'ok') {
    window.editPost(key);
    return;
  }
  statusEl.className = 'status';
  statusEl.textContent = '上架中…';
  let published;
  try {
    published = await api('POST', '/blog/publish', payload);
  } catch (e) {
    statusEl.className = 'status err';
    statusEl.textContent = '✗ 上架失败：' + e.message;
    return;
  }
  try {
    // 记下 slug：之后再改再上架，更新的是同一篇（同一个网址），不会多出一篇
    await setDoc(
      doc(db, 'blog_drafts', row.docId),
      { slug: published.slug, dirty: false, liveAt: serverTimestamp() },
      { merge: true },
    );
  } catch (e) {
    // 已经上线了，只是草稿箱的记录没跟上：列表会把它显示成两行。说清楚，别报成「上架失败」
    statusEl.className = 'status err';
    statusEl.textContent = `已上架，但草稿箱记录没更新（${e.message}）；列表可能重复显示，刷新后再看`;
    return;
  }
  await loadBlogPosts();
  waitForDeploy(published.commitSha, statusEl);
};

// 预览弹窗：返回 'ok'（确定上架）或 'cancel'（回去修改）
function showPreview(html) {
  const modal = document.getElementById('pv-modal');
  const frame = document.getElementById('pv-frame');
  frame.srcdoc = html;
  modal.hidden = false;
  return new Promise((resolve) => {
    const done = (v) => {
      modal.hidden = true;
      frame.srcdoc = '';
      document.getElementById('pv-ok').onclick = null;
      document.getElementById('pv-cancel').onclick = null;
      resolve(v);
    };
    document.getElementById('pv-ok').onclick = () => done('ok');
    document.getElementById('pv-cancel').onclick = () => done('cancel');
  });
}

window.unpublishRow = async function (key) {
  const row = blogRows.find((r) => r.key === key);
  if (!row || !row.live) return;
  if (!confirm(`下架「${row.title}」？网站上就看不到了；文章留在草稿箱，之后可以再上架。`)) return;
  const statusEl = document.getElementById('blog-deploy-status');
  statusEl.className = 'status';
  statusEl.textContent = '下架中…';
  try {
    // 只在线上的旧文章：先把内容存进草稿箱，再下架——下架会从仓库删掉文章，不先存就找不回来
    if (!row.docId) {
      const p = blogPosts.find((x) => x.slug === row.slug);
      await setDoc(doc(db, 'blog_drafts', docIdForSlug(p.slug)), {
        kind: 'post',
        slug: p.slug,
        tag: p.tag || '',
        date: p.date,
        title: p.title,
        body: p.body,
        cover: p.cover || null,
        dirty: false,
        updatedAt: serverTimestamp(),
      });
    }
    const { commitSha } = await api('POST', '/blog/unpublish', { slug: row.slug });
    await loadBlogPosts();
    waitForDeploy(commitSha, statusEl);
  } catch (e) {
    statusEl.className = 'status err';
    statusEl.textContent = '✗ 下架失败：' + e.message;
  }
};

window.fbLogout = () => signOut(auth).then(() => location.reload());

onAuthStateChanged(auth, user => {
  try {
    if (isAdmin(user)) {
      document.getElementById('fb-login').style.display = 'none';
      document.getElementById('editor').style.display = 'block';
      loadBlogPosts().catch(e => {
        document.getElementById('fb-login').style.display = 'flex';
        document.getElementById('editor').style.display = 'none';
        document.getElementById('fb-err').textContent =
          '已登录 ' + user.email + '，但文章列表加载失败：' + e.message + '（请把这句截图发给管理员）';
      });
      checkDraft();
    } else if (user) {
      // 浏览器里已登着一个非管理员账号（常见：在网站会员页用个人邮箱登过）。
      // 说清是哪个账号；再点登录时 fbLogin 会先退出它（2026-10-24 Yuki 卡在这里）。
      document.getElementById('fb-login').style.display = 'flex';
      document.getElementById('fb-err').textContent =
        '当前登录的是 ' + user.email + '，这个账号没有后台权限。请在上面输入后台账号重新登录。';
    } else {
      document.getElementById('fb-login').style.display = 'flex';
    }
  } catch (e) {
    console.error('[auth]', e);
    document.getElementById('fb-login').style.display = 'flex';
    document.getElementById('fb-err').textContent = '加载出错，请刷新页面重试。';
  }
});

window.fbLogin = async function() {
  const email = document.getElementById('fb-email').value.trim();
  const password = document.getElementById('fb-password').value;
  const errEl = document.getElementById('fb-err');
  const btn = document.getElementById('fb-login-btn');
  errEl.textContent = ''; btn.disabled = true; btn.textContent = '登录中…';
  try {
    // 先退出已登着的账号：同一账号再登一次不会触发 onAuthStateChanged，页面会停在「登录中…」
    if (auth.currentUser) await signOut(auth);
    await signInWithEmailAndPassword(auth, email, password);
  } catch (e) {
    errEl.textContent = loginErrorText(e);
    console.error('[auth]', e);
  } finally {
    btn.disabled = false; btn.textContent = '登录';
  }
};
</script>
</body>
</html>
