<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宏观对表 · 千里同風</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #faf9f7; --paper: #fff; --border: #e8e2da;
      --text: #1f1c17; --text2: #6b6359; --text3: #9ca3af;
      --accent: #2563eb; --green: #10b981; --red: #ef4444;
    }
    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      display: flex; flex-direction: column; min-height: 100vh;
    }

    /* ── 顶栏：与 /admin/ 保持一致 ── */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px; background: var(--paper);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .top-bar__left { display: flex; align-items: center; gap: 18px; }
    .top-bar__right { display: flex; align-items: center; gap: 10px; }
    .top-bar__logo { font-weight: 700; letter-spacing: .08em; color: var(--text); text-decoration: none; }
    .top-bar__nav { display: flex; gap: 14px; font-size: 13px; flex-wrap: wrap; }
    .top-bar__nav-current { color: var(--accent); border-bottom: 2px solid var(--accent); padding: 4px 0; }
    .top-bar__nav-link { color: var(--text2); text-decoration: none; }
    .top-bar__nav-link:hover { color: var(--text); }
    .top-bar__email { font-size: 12px; color: var(--text3); }
    .top-bar__btn {
      font-size: 12px; color: var(--text2); background: none;
      border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 10px; cursor: pointer; font-family: inherit;
    }
    .top-bar__btn:hover { color: var(--text); border-color: var(--text3); }

    /* ── 说明条 ── */
    .strip {
      padding: 9px 24px; font-size: 12.5px; color: var(--text2);
      background: #f4f1ec; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .strip b { color: var(--text); font-weight: 500; }
    .strip a { color: var(--accent); text-decoration: none; }
    .strip a:hover { text-decoration: underline; }

    /* ── 看板容器 ── */
    .frame-wrap { flex: 1; display: flex; min-height: 0; }
    #board { width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
    #loading { margin: auto; color: var(--text3); font-size: 13px; }

    /* ── 鉴权遮罩：与 /solutions/demo/admin.html 同一套 ── */
    .ag-overlay {
      position: fixed; inset: 0; z-index: 200; align-items: center;
      justify-content: center; background: rgba(28,25,20,.8);
    }
    #gate { display: flex; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    #noPerm { display: none; }
    .ag-box { background: #fff; border-radius: 16px; padding: 44px 36px; text-align: center; }
    .ag-box--login { max-width: 360px; width: calc(100% - 40px); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
    .ag-box--noperm { max-width: 340px; width: calc(100% - 40px); }
    .ag-icon { font-size: 36px; margin-bottom: 14px; }
    .ag-title { font-weight: 600; }
    .ag-title--login { font-size: 17px; margin-bottom: 6px; }
    .ag-title--noperm { font-size: 16px; margin-bottom: 8px; }
    .ag-desc { font-size: 13px; color: #9ca3af; }
    .ag-desc--login { margin-bottom: 22px; }
    .ag-desc--noperm { margin-bottom: 20px; }
    .ag-input {
      width: 100%; padding: 11px 14px; margin-bottom: 10px;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 14px; font-family: inherit;
    }
    .ag-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .ag-error { font-size: 12px; color: var(--red); min-height: 18px; margin-bottom: 6px; }
    .ag-btn-login, .ag-btn-noperm {
      width: 100%; padding: 11px; border: 0; border-radius: 8px;
      font-size: 14px; cursor: pointer; font-family: inherit;
    }
    .ag-btn-login { background: var(--accent); color: #fff; }
    .ag-btn-noperm { background: #f3f4f6; color: var(--text2); }
  </style>
  <link rel="stylesheet" href="/css/admin-header.css">
</head>
<body>

<!-- 登录 -->
<div id="gate" class="ag-overlay">
  <div class="ag-box ag-box--login">
    <div class="ag-icon">🔐</div>
    <h2 class="ag-title ag-title--login">管理员登录</h2>
    <p class="ag-desc ag-desc--login">仅限授权管理员访问</p>
    <input id="ge" type="email" placeholder="邮箱地址" class="ag-input" autocomplete="username">
    <input id="gp" type="password" placeholder="密码" class="ag-input" autocomplete="current-password">
    <div id="gm" class="ag-error"></div>
    <button id="glogin" type="button" class="ag-btn-login">登录</button>
  </div>
</div>

<!-- 无权限 -->
<div id="noPerm" class="ag-overlay">
  <div class="ag-box ag-box--noperm">
    <div class="ag-icon">🚫</div>
    <h2 class="ag-title ag-title--noperm">无访问权限</h2>
    <p class="ag-desc ag-desc--noperm">此页面仅限管理员查看。</p>
    <button id="noPermLogout" type="button" class="ag-btn-noperm">退出登录</button>
  </div>
</div>

<header class="top-bar">
  <div class="top-bar__left">
    <a href="/" class="top-bar__logo" title="返回网站主页">千里同風</a>
    <nav class="top-bar__nav">
      <a href="/admin/" class="top-bar__nav-link">网站内容</a>
      <a href="/admin/blog/" class="top-bar__nav-link">Blog</a>
      <a href="/solutions/demo/admin.html" class="top-bar__nav-link">运行监控</a>
      <a href="/solutions/demo/ai-intel.html" class="top-bar__nav-link">AI 情报</a>
      <span class="top-bar__nav-current">宏观对表</span>
    </nav>
  </div>
  <div class="top-bar__right">
    <span id="adminEmail" class="top-bar__email"></span>
    <button id="logout" type="button" class="top-bar__btn">退出</button>
  </div>
</header>

<div class="strip">
  <b>中国经济对表框架</b>的数据看板 · 每月 3/10/17/25 日自动采集 ·
  数据源与采集代码在私有仓库 <a href="https://github.com/sherlockafa007/china-macro-watch" target="_blank" rel="noopener">china-macro-watch</a>
  · 页面为手动同步，如需最新请重新导出
</div>

<div class="frame-wrap">
  <div id="loading">加载中…</div>
  <iframe id="board" title="宏观对表看板" referrerpolicy="no-referrer"></iframe>
</div>

<script type="module">
  import { auth } from '/js/shared/firebase-init.js';
  import { ADMINS } from '/js/shared/admins.js';
  import { onAuthStateChanged, signInWithEmailAndPassword, signOut }
    from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

  const $ = id => document.getElementById(id);

  // 鉴权通过后才给 iframe 赋 src——未登录时不主动去取看板文件。
  // 注意这是前端遮罩，挡的是误入而不是访问：知道 URL 的人仍可直接打开
  // macro-dashboard.html。看板里全是统计局/央行/Eurostat 公开发布的宏观数据，
  // 按这个前提选择了与站内其他内部页一致的最简方案。
  function showBoard() {
    const f = $('board');
    if (!f.src) f.src = 'macro-dashboard.html';
    f.style.display = 'block';
    $('loading').style.display = 'none';
  }

  onAuthStateChanged(auth, u => {
    if (!u) {
      $('gate').style.display = 'flex';
      $('noPerm').style.display = 'none';
      return;
    }
    if (!ADMINS.includes(u.email)) {
      $('gate').style.display = 'none';
      $('noPerm').style.display = 'flex';
      return;
    }
    $('gate').style.display = 'none';
    $('noPerm').style.display = 'none';
    $('adminEmail').textContent = u.email;
    showBoard();
  });

  async function doLogin() {
    const btn = $('glogin');
    $('gm').textContent = '';
    btn.disabled = true;
    try {
      await signInWithEmailAndPassword(auth, $('ge').value.trim(), $('gp').value);
    } catch (e) {
      $('gm').textContent = '邮箱或密码不正确';
      console.error('[auth]', e);
    } finally {
      btn.disabled = false;
    }
  }

  $('glogin').addEventListener('click', doLogin);
  $('gp').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('logout').addEventListener('click', () => signOut(auth));
  $('noPermLogout').addEventListener('click', () => signOut(auth));
</script>
</body>
</html>
