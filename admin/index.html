<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内容管理 · 千里同風</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #faf9f7; --paper: #fff; --border: #e8e2da;
      --text: #1f1c17; --text2: #6b6359; --text3: #9ca3af;
      --accent: #2563eb; --green: #10b981; --red: #ef4444;
    }
    body { font-family: 'Noto Sans SC', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Firebase login ── */
    #fb-login {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .fb-input {
      display: block; width: 100%; padding: 11px 14px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; font-family: inherit; outline: none;
      transition: border-color .15s; margin-bottom: 10px; background: var(--paper);
    }
    .fb-input:focus { border-color: var(--accent); }
    .fb-err { font-size: 13px; color: var(--red); min-height: 18px; margin-bottom: 10px; }

    /* ── Login card（Firebase 登录用） ── */
    .login-card {
      background: var(--paper); border: 1px solid var(--border); border-radius: 16px;
      padding: 48px 40px; max-width: 420px; width: 100%; text-align: center;
    }
    .login-logo { font-size: 28px; font-weight: 700; letter-spacing: .1em; margin-bottom: 6px; }
    .login-sub { font-size: 13px; color: var(--text3); margin-bottom: 32px; }
    .btn-primary {
      display: block; width: 100%; padding: 13px; background: var(--accent); color: #fff;
      border: none; border-radius: 10px; font-size: 15px; font-family: inherit;
      cursor: pointer; transition: opacity .15s;
    }
    .btn-primary:hover { opacity: .88; }
    .btn-primary:disabled { opacity: .5; cursor: default; }

    /* ── Editor ── */
    #editor { display: none; }
    .top-bar {
      position: sticky; top: 0; z-index: 50;
      background: var(--paper); border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 56px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .top-bar__right { display: flex; align-items: center; gap: 10px; }
    .top-bar__left { display: flex; align-items: center; gap: 18px; }
    .top-bar__logo { font-weight: 700; letter-spacing: .08em; color: var(--text); text-decoration: none; }
    .top-bar__nav { display: flex; gap: 14px; font-size: 13px; }
    .top-bar__nav-current { color: var(--accent); border-bottom: 2px solid var(--accent); padding: 4px 0; }
    .top-bar__nav-link { color: var(--text2); text-decoration: none; }
    .top-bar__nav-link:hover { color: var(--text); }
    .status { font-size: 12px; color: var(--text3); }
    .status.ok { color: var(--green); }
    .status.err { color: var(--red); }
    .btn-save {
      padding: 8px 20px; background: var(--accent); color: #fff; border: none;
      border-radius: 8px; font-size: 13px; font-family: inherit; cursor: pointer;
      transition: opacity .15s;
    }
    .btn-save:hover { opacity: .88; }
    .btn-save:disabled { opacity: .5; cursor: default; }
    .btn-link { background: none; border: none; font-size: 12px; color: var(--text3); cursor: pointer; }
    .btn-link:hover { color: var(--red); }

    /* ── Page switcher ── */
    .page-bar {
      display: flex; gap: 0; border-bottom: 1px solid var(--border);
      padding: 0 24px; background: var(--paper);
    }
    .page-btn {
      padding: 12px 18px; font-size: 13px; font-family: inherit; background: none; border: none;
      border-bottom: 2px solid transparent; cursor: pointer; color: var(--text3);
      transition: color .15s, border-color .15s;
    }
    .page-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .page-btn:hover:not(.active) { color: var(--text2); }

    /* ── Pending changes bar ── */
    .changes-bar {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 24px; background: #eef2ff; border-bottom: 1px solid var(--border);
      font-size: 13px; color: var(--text2);
    }
    .btn-sync {
      padding: 6px 14px; background: var(--accent); color: #fff; border: none;
      border-radius: 7px; font-size: 12px; font-family: inherit; cursor: pointer;
      transition: opacity .15s;
    }
    .btn-sync:hover { opacity: .88; }
    .btn-sync:disabled { opacity: .5; cursor: default; }

    /* ── Preview iframe ── */
    #preview-frame {
      width: 100%; height: calc(100vh - 101px); border: none; display: block; background: #fff;
    }
  </style>
  <link rel="stylesheet" href="/css/admin-header.css">


  <!-- head-meta:start（npm run meta 生成，勿手改） -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- head-meta:end -->
</head>
<body>

<!-- ══ Firebase Login ════════════════════════════════════════════════ -->
<div id="fb-login">
  <div class="login-card">
    <div class="login-logo">千里同風</div>
    <div class="login-sub">管理员登录</div>
    <input id="fb-email" type="email" class="fb-input" placeholder="邮箱地址" autocomplete="email">
    <input id="fb-password" type="password" class="fb-input" placeholder="密码" autocomplete="current-password">
    <div id="fb-err" class="fb-err"></div>
    <button type="button" class="btn-primary" id="fb-login-btn" onclick="fbLogin()">登录</button>
  </div>
</div>

<!-- ══ Editor ═════════════════════════════════════════════════════════ -->
<div id="editor">
  <div class="top-bar">
    <div class="top-bar__left">
      <a href="/" class="top-bar__logo" title="返回网站主页">千里同風</a>
      <nav class="top-bar__nav">
        <span class="top-bar__nav-current">网站内容</span>
        <a href="/admin/blog/" class="top-bar__nav-link">Blog</a>
        <a href="/solutions/demo/admin.html" class="top-bar__nav-link">运行监控</a>
        <a href="/solutions/demo/ai-intel.html" class="top-bar__nav-link">AI 情报</a>
        <a href="/admin/macro.html" class="top-bar__nav-link">宏观对表</a>
      <a href="/admin/accounting.html" class="top-bar__nav-link">自动化结账</a>
      </nav>
    </div>
    <div class="top-bar__right">
      <span class="status" id="status"></span>
      <button type="button" class="btn-save" id="save-btn" onclick="save()">保存并发布</button>
      <button type="button" class="btn-link" onclick="fbLogout()">退出登录</button>
    </div>
  </div>

  <div class="page-bar">
    <button type="button" class="page-btn active" data-page="home" onclick="switchPage('home')">首页</button>
    <button type="button" class="page-btn" data-page="about" onclick="switchPage('about')">关于我们</button>
    <button type="button" class="page-btn" data-page="milestones" onclick="switchPage('milestones')">大事记</button>
    <button type="button" class="page-btn" data-page="solutions" onclick="switchPage('solutions')">解决方案</button>
  </div>

  <div class="changes-bar" id="changes-bar" hidden>
    <span id="changes-count">已改 0 处</span>
    <button type="button" class="btn-sync" id="sync-btn" onclick="syncTranslate()">✨ 一键同步日英</button>
  </div>

  <iframe id="preview-frame" title="页面内容预览编辑"></iframe>
</div>

<script>
/* ── 可编辑页面清单：字段本身不再手工维护，改由 data-i18n 属性自动发现 ── */
const PAGES = {
  home:       { label: '首页',     url: '/' },
  about:      { label: '关于我们', url: '/about/' },
  milestones: { label: '大事记',   url: '/about/milestones.html' },
  solutions:  { label: '解决方案', url: '/solutions/' },
};

let currentOverrides = {}; // 已发布的基线（GET /content 结果），module script 的 loadContent/save 读写
let pendingZh = {};
let pendingJa = {};
let pendingEn = {};
let pendingImages = {}; // {key: dataURL}，待上传的新图片
let pendingTimeline = null; // 大事记时间点 [{id,date}]，改过才非 null（保存时整体替换）
let editingEl = null;
let editingOriginal = '';

const FRAME_STYLE = `
  [data-i18n]:hover { outline: 1px dashed #2563eb; outline-offset: 2px; cursor: text; }
  /* 编辑中：强制深字浅底。原来只换底色不换字色，首页标语等白字处变成浅底白字，不全选就看不见（2026-10-18 Yuki 反馈）。
     -webkit-text-fill-color / opacity / text-shadow 也一并压住，防止页面自身的渐变字、淡入动画、阴影透出来。 */
  [data-i18n][contenteditable="true"] {
    outline: 2px solid #2563eb; outline-offset: 2px; cursor: text;
    background: #ffffff !important; color: #1f2937 !important; -webkit-text-fill-color: #1f2937 !important;
    opacity: 1 !important; text-shadow: none !important; caret-color: #2563eb;
  }
  [data-i18n][contenteditable="true"]::selection { background: #bfdbfe; color: #1f2937; -webkit-text-fill-color: #1f2937; }
  [data-image-key] { cursor: pointer; }
  [data-image-key]:hover { outline: 2px dashed #2563eb; outline-offset: 2px; }
  /* 大事记：每个时间点下方的操作按钮（只在后台预览里出现） */
  .cms-tl-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .cms-tl-bar button, .cms-tl-top {
    font: 12px/1.4 system-ui, sans-serif; padding: 4px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid #c7d2fe; background: #eef2ff; color: #1e3a8a;
  }
  .cms-tl-bar button:disabled { opacity: .35; cursor: default; }
  .cms-tl-bar .cms-danger { border-color: #fecaca; background: #fef2f2; color: #b91c1c; }
  .cms-tl-top { margin-bottom: 28px; }
  .cms-pill {
    position: absolute; z-index: 999999; display: flex; gap: 6px;
    background: #1f1c17; border-radius: 8px; padding: 5px 7px; box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }
  .cms-pill button {
    border: none; border-radius: 5px; font-size: 12px; font-family: system-ui, sans-serif;
    padding: 4px 9px; cursor: pointer;
  }
  .cms-pill .cms-ok { background: #10b981; color: #fff; }
  .cms-pill .cms-cancel { background: #4b5563; color: #fff; }
`;

function updateChangesBar() {
  const count =
    Object.keys(pendingZh).length + Object.keys(pendingImages).length + (pendingTimeline ? 1 : 0);
  const bar = document.getElementById('changes-bar');
  bar.hidden = count === 0;
  document.getElementById('changes-count').textContent = `已改 ${count} 处`;
}

// 保存/同步/切页前都要调用：如果有字段还在编辑中（用户没点"✓ 完成"就去点了别的按钮），
// 自动帮他确认一下，避免"看起来保存了，其实刚打的字丢了"。
function commitActiveEdit() {
  if (editingEl) finishEdit(true);
}

/* ── 页面切换 ── */
function switchPage(key) {
  commitActiveEdit();
  document.querySelectorAll('.page-btn').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.page === key);
  });
  const frame = document.getElementById('preview-frame');
  frame.onload = () => initEditableFrame(frame);
  frame.src = PAGES[key].url + '?lang=zh';
}

/* ── 让 iframe 里的 [data-i18n] 元素可点击就地编辑（同源，直接操作 contentDocument） ── */
function initEditableFrame(frame) {
  const doc = frame.contentDocument;
  if (!doc) return;

  const style = doc.createElement('style');
  style.textContent = FRAME_STYLE;
  doc.head.appendChild(style);

  // 把本次会话里已改但未发布的值，重新套到刚加载的页面上——
  // 否则切走标签再切回来，看到的是发布前的旧文字/旧图片，像是改动丢了。
  doc.querySelectorAll('[data-i18n]').forEach((el) => {
    const key = el.dataset.i18n;
    if (pendingZh[key] !== undefined) el.textContent = pendingZh[key];
  });
  doc.querySelectorAll('[data-image-key]').forEach((el) => {
    const key = el.dataset.imageKey;
    if (pendingImages[key]) applyImagePreview(el, pendingImages[key]);
  });

  editingEl = null;

  // 大事记页：重绘时间点（本次会话里增删移过的话按改后的顺序），并加上操作按钮
  if (doc.querySelector('.timeline')) renderTimelineEditor(frame);

  doc.addEventListener(
    'click',
    (e) => {
      const textEl = e.target.closest('[data-i18n]');
      if (textEl && textEl.isContentEditable) return; // 已在编辑中，交给浏览器处理光标定位
      const imageEl = e.target.closest('[data-image-key]');
      e.preventDefault(); // 预览态下不允许真的跳转
      if (imageEl) {
        startImageEdit(imageEl);
      } else if (textEl) {
        startEdit(doc, textEl);
      }
    },
    true,
  );
}

/* ── 大事记：时间点的插入 / 删除 / 上下移动 / 改日期（2026-10-18）──
   列表存进 content.json 的 timeline（[{id,date}]，顺序＝显示顺序）；文字仍是 msN_event / msN_desc，
   和其他文字一样点击就地修改、用「一键同步日英」翻译。改动先暂存在 pendingTimeline，
   点「保存并发布」才生效。 */
function timelineFromDom(doc) {
  return [...doc.querySelectorAll('.timeline__item[data-ms-id]')].map((el) => ({
    id: el.dataset.msId,
    date: (el.querySelector('.timeline__year')?.textContent || '').trim(),
  }));
}

function currentTimeline(doc) {
  if (pendingTimeline) return pendingTimeline.map((x) => ({ ...x }));
  if (Array.isArray(currentOverrides.timeline)) return currentOverrides.timeline.map((x) => ({ ...x }));
  return timelineFromDom(doc);
}

// 新编号取「出现过的最大编号 + 1」：删掉的条目文字还留在 content.json / main.js 里，
// 编号复用的话，没翻译的语言会冒出旧条目的文字。sdfT 能探到 main.js 内置的 ms1〜ms4。
function nextTimelineId(list, win) {
  let max = 0;
  const bump = (k) => {
    const m = /^ms(\d+)(?:_|$)/.exec(k);
    if (m) max = Math.max(max, Number(m[1]));
  };
  list.forEach((x) => bump(x.id));
  for (const g of ['ja', 'zh', 'en']) Object.keys(currentOverrides[g] || {}).forEach(bump);
  Object.keys(pendingZh).forEach(bump);
  while (win.sdfT && win.sdfT('ms' + (max + 1) + '_event', null) !== null) max++;
  return 'ms' + (max + 1);
}

function askDate(initial) {
  const v = window.prompt('日期（例如 2026.10 或 2026.05–06）：', initial || '');
  if (v === null) return null;
  const d = v.trim();
  if (!d || d.length > 30) {
    window.alert('日期不能为空，且不超过 30 个字。');
    return null;
  }
  return d;
}

function renderTimelineEditor(frame) {
  const doc = frame.contentDocument;
  const win = frame.contentWindow;
  if (typeof win.sdfRenderTimeline !== 'function') return; // main.js 还没加载完：保持静态内容
  const list = currentTimeline(doc);
  win.sdfRenderTimeline(list);
  // 重绘会重建元素，把本次会话里还没发布的文字改动重新套上
  doc.querySelectorAll('.timeline [data-i18n]').forEach((el) => {
    if (pendingZh[el.dataset.i18n] !== undefined) el.textContent = pendingZh[el.dataset.i18n];
  });

  const apply = (next) => {
    commitActiveEdit();
    pendingTimeline = next;
    updateChangesBar();
    renderTimelineEditor(frame);
  };
  const insertAt = (at) => {
    commitActiveEdit();
    const date = askDate('');
    if (date === null) return;
    const next = currentTimeline(doc);
    const id = nextTimelineId(next, win);
    pendingZh[id + '_event'] = '新事件（点击修改标题）';
    pendingZh[id + '_desc'] = '说明（点击修改内容）';
    next.splice(at, 0, { id, date });
    apply(next);
  };

  const box = doc.querySelector('.timeline');
  box.querySelectorAll('.cms-tl-top').forEach((el) => el.remove());
  const top = doc.createElement('button');
  top.type = 'button';
  top.className = 'cms-tl-top';
  top.textContent = '＋ 在最前面插入时间点';
  top.addEventListener('click', () => insertAt(0));
  box.prepend(top);

  const items = [...doc.querySelectorAll('.timeline__item')];
  items.forEach((el, i) => {
    const bar = doc.createElement('div');
    bar.className = 'cms-tl-bar';
    const add = (label, onClick, { disabled = false, danger = false } = {}) => {
      const b = doc.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.disabled = disabled;
      if (danger) b.className = 'cms-danger';
      b.addEventListener('click', onClick);
      bar.appendChild(b);
    };
    add(
      '↑ 上移',
      () => {
        const next = currentTimeline(doc);
        [next[i - 1], next[i]] = [next[i], next[i - 1]];
        apply(next);
      },
      { disabled: i === 0 },
    );
    add(
      '↓ 下移',
      () => {
        const next = currentTimeline(doc);
        [next[i + 1], next[i]] = [next[i], next[i + 1]];
        apply(next);
      },
      { disabled: i === items.length - 1 },
    );
    add('改日期', () => {
      const next = currentTimeline(doc);
      const date = askDate(next[i].date);
      if (date === null) return;
      next[i] = { ...next[i], date };
      apply(next);
    });
    add('＋ 在下方插入', () => insertAt(i + 1));
    add(
      '删除',
      () => {
        const next = currentTimeline(doc);
        const title = el.querySelector('.timeline__event')?.textContent.trim() || next[i].id;
        if (!window.confirm('删除「' + title + '」这个时间点？（点「保存并发布」后才会生效）')) return;
        const [gone] = next.splice(i, 1);
        // 还没发布过的新条目，连它的暂存文字一起丢掉，免得把孤儿文字存进 content.json
        for (const k of [gone.id + '_event', gone.id + '_desc']) {
          delete pendingZh[k];
          delete pendingJa[k];
          delete pendingEn[k];
        }
        apply(next);
      },
      { danger: true },
    );
    el.appendChild(bar);
  });
}

/* ── 图片位预览：在容器内插入/更新一张覆盖全区域的 <img>，object-fit:cover 不拉伸 ── */
function applyImagePreview(el, dataUrl) {
  let img = el.querySelector('.content-image');
  if (!img) {
    img = el.ownerDocument.createElement('img');
    img.className = 'content-image';
    img.alt = '';
    el.style.position = 'relative';
    el.appendChild(img);
  }
  img.src = dataUrl;
}

/* ── 压缩图片：canvas 转 WebP，超限自动降质重试，保持原始宽高比不拉伸。
   onSuccess(dataUrl) / onError(message) 两个回调，失败时不吞错误。 ── */
function compressImageToWebp(file, maxBytes, onSuccess, onError) {
  const reader = new FileReader();
  reader.onerror = () => onError('图片读取失败，请重试');
  reader.onload = (e) => {
    const img = new Image();
    img.onerror = () => onError('图片格式无法识别，请更换文件');
    img.onload = () => {
      const MAX_SIDE = 1600;
      let { width, height } = img;
      if (width > MAX_SIDE || height > MAX_SIDE) {
        const ratio = Math.min(MAX_SIDE / width, MAX_SIDE / height);
        width = Math.round(width * ratio);
        height = Math.round(height * ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      let quality = 0.85;
      let dataUrl = canvas.toDataURL('image/webp', quality);
      while (Math.floor((dataUrl.length * 3) / 4) > maxBytes && quality > 0.4) {
        quality -= 0.15;
        dataUrl = canvas.toDataURL('image/webp', quality);
      }
      if (Math.floor((dataUrl.length * 3) / 4) > maxBytes) {
        onError('图片过大，请更换');
        return;
      }
      onSuccess(dataUrl);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

const MAX_IMAGE_BYTES = 1_000_000;

/* ── 点击图片位：弹文件选择框，选完压缩、预览、暂存 ── */
function startImageEdit(el) {
  const key = el.dataset.imageKey;
  const doc = el.ownerDocument;
  const input = doc.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    compressImageToWebp(
      file,
      MAX_IMAGE_BYTES,
      (dataUrl) => {
        pendingImages[key] = dataUrl;
        applyImagePreview(el, dataUrl);
        updateChangesBar();
      },
      (message) => doc.defaultView.alert(message),
    );
  };
  input.click();
}

/* ── 开始编辑一个字段 ── */
function startEdit(doc, el) {
  if (editingEl && editingEl !== el) finishEdit(true); // 切到新字段前，先确认上一个

  editingEl = el;
  editingOriginal = el.textContent;
  el.contentEditable = 'true';
  el.focus();

  // 粘贴只插纯文本。监听器每个元素只挂一次：原来每进一次编辑就多挂一个，同一处第 N 次编辑时
  // 粘贴会插入 N 遍（简介里文字重复 2〜4 遍的真因，2026-10-18 查明）。
  if (!el.dataset.cmsPasteBound) {
    el.dataset.cmsPasteBound = '1';
    el.addEventListener('paste', (e) => {
      e.preventDefault();
      const text = (e.clipboardData || doc.defaultView.clipboardData).getData('text/plain');
      doc.execCommand('insertText', false, text);
    });
  }

  const range = doc.createRange();
  range.selectNodeContents(el);
  const sel = doc.defaultView.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  const pill = doc.createElement('div');
  pill.className = 'cms-pill';
  pill.id = 'cms-active-pill';
  pill.innerHTML =
    '<button type="button" class="cms-ok">✓ 完成</button><button type="button" class="cms-cancel">✕ 取消</button>';
  doc.body.appendChild(pill);
  const rect = el.getBoundingClientRect();
  pill.style.top = `${Math.max(0, rect.top - 40)}px`;
  pill.style.left = `${rect.left}px`;
  pill.querySelector('.cms-ok').onclick = (e) => {
    e.preventDefault();
    finishEdit(true);
  };
  pill.querySelector('.cms-cancel').onclick = (e) => {
    e.preventDefault();
    finishEdit(false);
  };
}

/* ── 结束编辑：commit=true 确认保留，false 撤销还原 ── */
function finishEdit(commit) {
  if (!editingEl) return;
  const doc = editingEl.ownerDocument;
  const key = editingEl.dataset.i18n;

  if (commit) {
    const newVal = editingEl.innerText.trim();
    if (newVal && newVal !== editingOriginal.trim()) {
      pendingZh[key] = newVal;
      updateChangesBar();
    }
  } else {
    editingEl.textContent = editingOriginal;
  }

  editingEl.contentEditable = 'false';
  const pill = doc.getElementById('cms-active-pill');
  if (pill) pill.remove();
  editingEl = null;
}
</script>

<script type="module">
import { auth, db } from '/js/shared/firebase-init.js';
import { initErrorReporting } from '/js/shared/report-error.js';
import { isAdmin } from '/js/shared/admins.js';
import { pollMirrorHead } from '/js/shared/deploy-poll.js';
import { onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

initErrorReporting({ db });

// 保存通道：站长自己 CF 账号下的 sdf-admin Worker（服务端持有 GitHub 令牌）
const WORKER_URL = 'https://sdf-admin.sherlockafa.workers.dev';
// 发布后轮询镜像仓库 HEAD 确认上线（镜像 HEAD == 本次 commit 即同步完成）
const MIRROR_API = 'https://api.github.com/repos/Eveysnow5/senridf-web/commits/main';

async function api(method, path, body) {
  const idToken = await auth.currentUser.getIdToken(); // SDK 自动续期
  const res = await fetch(WORKER_URL + path, {
    method,
    headers: {
      Authorization: `Bearer ${idToken}`,
      ...(body ? { 'Content-Type': 'application/json' } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch { /* 非 JSON 响应按状态码报错 */ }
  if (!res.ok) throw new Error(data.error || `请求失败（${res.status}）`);
  return data;
}

async function loadContent() {
  const { content } = await api('GET', '/content');
  currentOverrides = content || {};
  document.getElementById('editor').style.display = 'block';
  switchPage('home');
}

async function waitForDeploy(commitSha, statusEl) {
  statusEl.className = 'status'; statusEl.textContent = '✓ 已保存，同步部署中…（约2-3分钟）';
  const r = await pollMirrorHead({
    url: MIRROR_API,
    commitSha,
    fetchImpl: (u) => fetch(u),
    sleep: (ms) => new Promise((done) => setTimeout(done, ms)),
  });
  if (r.state === 'synced') {
    statusEl.className = 'status ok';
    statusEl.textContent = '✓ 已上线（如未见变化，等约1分钟后刷新网站）';
    return;
  }
  if (r.state === 'unreachable') {
    // 一次都没查到 ≠ 部署慢。说出原因，否则 CSP 拦截、限流、断网都长一样。
    statusEl.className = 'status err';
    statusEl.textContent = `已保存；但一次都没查到镜像状态（${r.lastError?.message || '原因未知'}），请直接打开网站确认`;
    console.warn('镜像状态查询全程失败，最后一次错误：', r.lastError);
    return;
  }
  statusEl.textContent = '已保存；上线状态未确认，稍后可直接查看网站';
}

// 旧 Worker 不认 changes：它会把 changes 当成整份内容，存成只有 {images:{}} 的 content.json，
// 等于清空全站文字。所以保存前先确认 Worker 已是新协议（/health 的 api ≥ 2），否则拒绝保存。
async function ensureSaveApi() {
  let data = {};
  try {
    const res = await fetch(WORKER_URL + '/health');
    data = await res.json();
  } catch {
    /* 网络错误按版本未知处理 */
  }
  if (!(Number(data.api) >= 2)) {
    throw new Error('保存服务尚未更新到新版本，为避免覆盖网站内容已停止保存，请联系管理员');
  }
}

window.save = async function () {
  commitActiveEdit();
  const btn = document.getElementById('save-btn');
  const statusEl = document.getElementById('status');
  btn.disabled = true;
  btn.textContent = '保存中…';
  statusEl.className = 'status';
  statusEl.textContent = '';
  try {
    // 只发「这次改了哪几项」，由 Worker 在最新版 content.json 上合并（2026-10-18）。
    // 以前发的是打开后台时读到的整份内容＋改动，期间别人改过的会被旧副本盖掉。
    const changes = {};
    if (Object.keys(pendingZh).length) changes.zh = { ...pendingZh };
    if (Object.keys(pendingJa).length) changes.ja = { ...pendingJa };
    if (Object.keys(pendingEn).length) changes.en = { ...pendingEn };
    if (pendingTimeline) changes.timeline = pendingTimeline.map(({ id, date }) => ({ id, date }));
    const hasImages = Object.keys(pendingImages).length > 0;
    if (!Object.keys(changes).length && !hasImages) {
      statusEl.textContent = '没有需要保存的改动';
      btn.disabled = false;
      btn.textContent = '保存并发布';
      return;
    }
    await ensureSaveApi();
    const payload = { changes };
    if (hasImages) payload.images = { ...pendingImages };
    const { commitSha, content } = await api('PUT', '/content', payload);
    if (content) currentOverrides = content; // 合并后的完整版本（含别人刚改的）当新基线
    pendingZh = {};
    pendingJa = {};
    pendingEn = {};
    pendingImages = {};
    pendingTimeline = null;
    updateChangesBar();
    waitForDeploy(commitSha, statusEl);
  } catch (e) {
    statusEl.className = 'status err';
    statusEl.textContent = '✗ 保存失败：' + e.message;
  }
  btn.disabled = false;
  btn.textContent = '保存并发布';
};

window.syncTranslate = async function () {
  commitActiveEdit();
  const fields = Object.entries(pendingZh).map(([key, zh]) => ({ key, zh }));
  if (fields.length === 0) return;
  const btn = document.getElementById('sync-btn');
  btn.disabled = true;
  btn.textContent = '同步中…';
  try {
    const result = await api('POST', '/translate', { fields });
    Object.assign(pendingJa, result.ja || {});
    Object.assign(pendingEn, result.en || {});
    const synced = Object.keys(result.ja || {}).length;
    btn.textContent =
      synced >= fields.length ? '✓ 已同步日英' : `已同步 ${synced}/${fields.length} 处，可重试补齐`;
  } catch (e) {
    btn.textContent = '同步失败，点击重试';
  }
  btn.disabled = false;
};

window.fbLogout = () => signOut(auth).then(() => location.reload());

onAuthStateChanged(auth, user => {
  try {
    if (isAdmin(user)) {
      document.getElementById('fb-login').style.display = 'none';
      loadContent().catch(e => {
        document.getElementById('fb-login').style.display = 'flex';
        document.getElementById('fb-err').textContent = '内容加载失败：' + e.message;
      });
    } else if (user) {
      document.getElementById('fb-err').textContent = '该账号无管理员权限。';
    } else {
      document.getElementById('fb-login').style.display = 'flex';
    }
  } catch (e) {
    console.error('[auth]', e);
    document.getElementById('fb-login').style.display = 'flex';
    document.getElementById('fb-err').textContent = '加载出错，请刷新页面重试。';
  }
});

window.fbLogin = async function() {
  const email = document.getElementById('fb-email').value.trim();
  const password = document.getElementById('fb-password').value;
  const errEl = document.getElementById('fb-err');
  const btn = document.getElementById('fb-login-btn');
  errEl.textContent = ''; btn.disabled = true; btn.textContent = '登录中…';
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch {
    errEl.textContent = '邮箱或密码错误，请重试。';
    btn.disabled = false; btn.textContent = '登录';
  }
};
</script>
</body>
