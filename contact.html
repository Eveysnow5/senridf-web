<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ | 千里同風</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400&family=Noto+Serif+JP:wght@300;400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        nav { border-bottom: 1px solid #E0E0D8; }
        nav a { text-decoration: none; color: #1C1C1C; }
        nav a:hover { color: #3A6A4A; }
        .nav-container { max-width: 1280px; margin: 0 auto; padding: 24px 48px; display: flex; justify-content: space-between; align-items: center; }
        .nav-logo { font-size: 20px; font-weight: 600; color: #1D3D2D; }
        .nav-links { list-style: none; display: flex; gap: 48px; margin: 0; padding: 0; }
        .page-container { max-width: 600px; margin: 0 auto; padding: 96px 48px; }
        h1 { font-size: 40px; font-weight: 600; margin-bottom: 16px; }
        h2 { font-size: 20px; font-weight: 600; margin-bottom: 16px; margin-top: 48px; }
        p { font-size: 16px; line-height: 1.8; color: #4A4A47; margin-bottom: 16px; }
        form { display: flex; flex-direction: column; gap: 24px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #1C1C1C; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #E0E0D8; font-size: 16px; font-family: inherit; background-color: white; color: #1C1C1C; }
        textarea { min-height: 120px; resize: vertical; }
        button { padding: 16px; background-color: #1D3D2D; color: white; font-weight: 600; font-size: 16px; border: none; cursor: pointer; }
        button:hover { background-color: #3A6A4A; }
        .divider { margin-top: 64px; padding-top: 48px; border-top: 1px solid #E0E0D8; }
        a { color: #1D3D2D; text-decoration: none; }
        a:hover { color: #3A6A4A; }
        .footer { padding: 48px; border-top: 1px solid #E0E0D8; background-color: #F2F2EC; text-align: center; font-size: 14px; color: #8C8C88; }
    </style>
</head>
<body style="background-color: #F8F8F5; color: #1C1C1C;">
    <nav>
        <div class="nav-container">
            <a href="/" class="nav-logo" style="text-decoration: none;">千里同風</a>
            <ul class="nav-links">
                <li><a href="/">ホーム</a></li>
                <li><a href="/solutions/automation.html">ソリューション</a></li>
                <li><a href="/about/">について</a></li>
                <li><a href="/privacy.html">プライバシー</a></li>
                <li><a href="/contact.html">お問い合わせ</a></li>
            </ul>
        </div>
    </nav>

    <div class="page-container">
        <h1>お問い合わせ</h1>
        <p>ご不明な点や機能要望についてはお気軽にお問い合わせください。</p>

        <form>
            <div>
                <label>お名前</label>
                <input type="text" name="name" placeholder="例：山田太郎" required>
            </div>

            <div>
                <label>メールアドレス</label>
                <input type="email" name="email" placeholder="例：yamada@example.com" required>
            </div>

            <div>
                <label>ご所属企業（任意）</label>
                <input type="text" name="company" placeholder="例：〇〇株式会社">
            </div>

            <div>
                <label>お問い合わせ内容</label>
                <textarea name="message" placeholder="ご質問内容をお書きください" required></textarea>
            </div>

            <button type="submit">送信</button>
        </form>

        <div class="divider">
            <h2>別の方法でのお問い合わせ</h2>
            <p>メールで直接お問い合わせください：</p>
            <p><a href="mailto:team@senridf.com">team@senridf.com</a></p>
        </div>
    </div>

    <div class="footer">
        <p>お送りいただいた情報は当社のプライバシーポリシーに基づき管理されます。</p>
    </div>
</body>
</html>
