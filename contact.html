<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ | 千里同風</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body style="background-color: #F8F8F5; color: #1C1C1C;">
    <nav style="border-bottom: 1px solid #E0E0D8;">
        <div style="max-width: 1280px; margin: 0 auto; padding: 24px 32px; display: flex; justify-content: space-between; align-items: center;">
            <a href="/" style="font-size: 20px; font-weight: bold; color: #1D3D2D; text-decoration: none;">千里同風</a>
            <ul style="list-style: none; display: flex; gap: 32px;">
                <li><a href="/" style="color: #1C1C1C; text-decoration: none;">ホーム</a></li>
                <li><a href="/solutions/" style="color: #1C1C1C; text-decoration: none;">ソリューション</a></li>
                <li><a href="/about/" style="color: #1C1C1C; text-decoration: none;">について</a></li>
            </ul>
        </div>
    </nav>

    <section style="padding: 96px 32px;">
        <div style="max-width: 600px; margin: 0 auto;">
            <h1 style="font-size: 40px; font-weight: bold; margin-bottom: 16px;">お問い合わせ</h1>
            <p style="font-size: 18px; color: #4A4A47; margin-bottom: 48px;">ご不明な点や機能要望についてはお気軽にお問い合わせください。</p>

            <form style="display: flex; flex-direction: column; gap: 24px;">
                <div>
                    <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #1C1C1C;">お名前</label>
                    <input type="text" name="name" style="width: 100%; padding: 12px; border: 1px solid #E0E0D8; font-size: 16px;" placeholder="例：山田太郎" required>
                </div>

                <div>
                    <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #1C1C1C;">メールアドレス</label>
                    <input type="email" name="email" style="width: 100%; padding: 12px; border: 1px solid #E0E0D8; font-size: 16px;" placeholder="例：yamada@example.com" required>
                </div>

                <div>
                    <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #1C1C1C;">ご所属企業（任意）</label>
                    <input type="text" name="company" style="width: 100%; padding: 12px; border: 1px solid #E0E0D8; font-size: 16px;" placeholder="例：〇〇株式会社">
                </div>

                <div>
                    <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #1C1C1C;">お問い合わせ内容</label>
                    <textarea name="message" style="width: 100%; padding: 12px; border: 1px solid #E0E0D8; font-size: 16px; font-family: inherit; min-height: 120px;" placeholder="ご質問内容をお書きください" required></textarea>
                </div>

                <div style="margin-top: 32px;">
                    <button type="submit" style="width: 100%; padding: 16px; background-color: #1D3D2D; color: white; font-weight: bold; font-size: 16px; border: none; cursor: pointer;">送信</button>
                </div>
            </form>

            <div style="margin-top: 64px; padding-top: 48px; border-top: 1px solid #E0E0D8;">
                <h2 style="font-size: 20px; font-weight: bold; margin-bottom: 16px;">別の方法でのお問い合わせ</h2>
                <p style="color: #4A4A47; margin-bottom: 8px;">メールで直接お問い合わせください：</p>
                <a href="mailto:team@senridf.com" style="color: #1D3D2D; font-weight: bold; text-decoration: none; font-size: 18px;">team@senridf.com</a>
            </div>
        </div>
    </section>

    <section style="padding: 48px 32px; border-top: 1px solid #E0E0D8; background-color: #F2F2EC;">
        <div style="max-width: 600px; margin: 0 auto; text-align: center; font-size: 14px; color: #8C8C88;">
            <p>お送りいただいた情報は当社のプライバシーポリシーに基づき管理されます。</p>
        </div>
    </section>
</body>
</html>
