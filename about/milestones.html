<body data-page-title="milestones_page_title">

  <div id="nav-placeholder"></div>

  <main>

    <!-- Page Header -->
    <div class="page-header">
      <div class="page-header__container">
        <div data-animate>
          <span class="section__eyebrow" data-i18n="milestones_eyebrow">沿革</span>
          <h1 class="section__title" data-i18n="milestones_title">会社の歩み</h1>
          <p class="section__lead" data-i18n="milestones_body">千里同風株式会社の設立から現在までの歩みをご覧ください。</p>
        </div>
      </div>
    </div>

    <!-- Timeline -->
    <section class="section">
      <div class="timeline">
        <!-- 日付の根拠（2026-10-06 作者指摘で全面修正）：設立＝履歴事項全部証明書「会社成立の年月日
             令和7年2月25日」。サイト＝リポジトリ初回コミット 2026-05-16（中日翻訳を含む）。
             各ツール＝各ページの初回追加日（05-18〜06-17）。受発注＝2026-09-14。
             旧版の「2024 設立」「2024 市場調査開始」「2025 サイト公開」は根拠なし。 -->

        <div class="timeline__item" data-animate>
          <div class="timeline__year">2025.02</div>
          <div>
            <h3 class="timeline__event" data-i18n="ms1_event">千里同風株式会社 設立</h3>
            <p class="timeline__desc" data-i18n="ms1_desc">
              大阪市にて設立。AIの研究と、AIを組み込んだ製品・サービスの企画を事業として始動。
            </p>
          </div>
        </div>

        <div class="timeline__item" data-animate data-animate-delay="1">
          <div class="timeline__year">2026.05</div>
          <div>
            <h3 class="timeline__event" data-i18n="ms2_event">公式ウェブサイト 公開</h3>
            <p class="timeline__desc" data-i18n="ms2_desc">
              公式ウェブサイトを公開。最初のAIツール「中日翻訳」も同時にリリース。
            </p>
          </div>
        </div>

        <div class="timeline__item" data-animate data-animate-delay="2">
          <div class="timeline__year">2026.05–06</div>
          <div>
            <h3 class="timeline__event" data-i18n="ms3_event">オンラインAIツール 順次公開</h3>
            <p class="timeline__desc" data-i18n="ms3_desc">
              文書分析・人生インタビュー・日本語動詞活用・入札情報モニタリング・中国語原稿校正を順次公開。
            </p>
          </div>
        </div>

        <div class="timeline__item" data-animate data-animate-delay="3">
          <div class="timeline__year">2026.09</div>
          <div>
            <h3 class="timeline__event" data-i18n="ms4_event">受発注の自動化 デモ公開</h3>
            <p class="timeline__desc" data-i18n="ms4_desc">
              注文書をAIで受注台帳に整形する、中小企業向けの業務自動化を開始。
            </p>
          </div>
        </div>

      </div>
    </section>

  </main>
