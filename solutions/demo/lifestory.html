<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生平故事 · 千里同風</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.12/dist/purify.min.js" integrity="sha384-piCcpDdJ7qVeK4Tv8Z6Hpcr3ZBIgP16TxQTPVfsLFdZ5uDgwc3Y8Ho7oUnqf12qu" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #faf8f4;
      --paper:  #ffffff;
      --text:   #2c2415;
      --text2:  #7a6845;
      --accent: #8b6914;
      --accentl:#f5ede0;
      --border: #e8ddd0;
      --red:    #c0392b;
      --r:      12px;
    }
    body { font-family: 'Noto Sans SC', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Header ── */
    .hdr { background: var(--paper); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .hdr-left { display: flex; align-items: center; gap: 14px; }
    .back { color: var(--text2); text-decoration: none; font-size: 14px; }
    .back:hover { color: var(--accent); }
    .hdr-title { font-family: 'Noto Serif SC', serif; font-size: 17px; font-weight: 600; }
    .hdr-prog { font-size: 13px; color: var(--text2); }
    .btn-gen { background: var(--accent); color: #fff; border: none; padding: 8px 20px; border-radius: 20px; font-size: 14px; cursor: pointer; font-family: inherit; transition: opacity .2s; }
    .btn-gen:hover { opacity: .85; }
    .btn-gen:disabled { opacity: .35; cursor: default; }
    .prog-bar { height: 3px; background: var(--border); }
    .prog-fill { height: 100%; background: var(--accent); transition: width .5s ease; }

    /* ── Layout ── */
    .main { max-width: 680px; margin: 0 auto; padding: 44px 24px; }
    .sec { display: none; }
    .sec.on { display: block; }

    /* ── Welcome ── */
    .welcome { background: var(--paper); border: 1px solid var(--border); border-radius: var(--r); padding: 56px 44px; text-align: center; }
    .welcome-icon { font-size: 52px; margin-bottom: 22px; }
    .welcome-title { font-family: 'Noto Serif SC', serif; font-size: 26px; font-weight: 700; margin-bottom: 16px; }
    .welcome-desc { font-size: 15px; line-height: 1.9; color: var(--text2); margin-bottom: 36px; }
    .btn-start { background: var(--accent); color: #fff; border: none; padding: 14px 40px; border-radius: 28px; font-size: 16px; cursor: pointer; font-family: inherit; }
    .btn-start:hover { opacity: .85; }
    .btn-view-story { display: block; margin: 14px auto 0; background: none; border: none; color: var(--accent); font-size: 14px; cursor: pointer; font-family: inherit; }
    .btn-view-story:hover { text-decoration: underline; }

    /* ── Loading ── */
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px; gap: 18px; color: var(--text2); font-size: 15px; }
    .spinner { width: 38px; height: 38px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Question ── */
    .q-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .q-cat { background: var(--accentl); color: var(--accent); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
    .q-num { font-size: 13px; color: var(--text2); }
    .q-transition { font-size: 14px; color: var(--text2); font-style: italic; margin-bottom: 10px; line-height: 1.7; min-height: 20px; }
    .q-text { font-family: 'Noto Serif SC', serif; font-size: 21px; line-height: 1.8; margin-bottom: 26px; }
    .answer-box { background: var(--paper); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; margin-bottom: 14px; }
    .answer-ta { width: 100%; border: none; outline: none; font-family: 'Noto Sans SC', system-ui, sans-serif; font-size: 16px; line-height: 1.85; color: var(--text); background: transparent; resize: none; min-height: 120px; }
    .answer-ta::placeholder { color: var(--text2); opacity: .55; }
    .answer-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .btn-mic { display: flex; align-items: center; gap: 7px; background: none; border: 1px solid var(--border); padding: 7px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; color: var(--text2); font-family: inherit; transition: all .2s; }
    .btn-mic:hover { border-color: var(--accent); color: var(--accent); }
    .btn-mic.rec { background: var(--red); border-color: var(--red); color: #fff; animation: pulse 1.5s infinite; }
    @keyframes pulse { 50% { opacity: .7; } }
    .mic-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .char-ct { font-size: 12px; color: var(--text2); }
    .char-hint { font-size: 12px; margin-top: 8px; padding: 6px 10px; border-radius: 6px; }
    .char-hint.short { background: #fef3f2; color: #d14040; }
    .char-hint.good { background: #f0fef0; color: #2e7d2e; }
    .char-hint.long { background: #fffbef; color: #b87e0b; }
    .char-hint.toolong { background: #fef2f2; color: #c0392b; }
    .q-foot { display: flex; align-items: center; justify-content: space-between; }
    .btn-skip { background: none; border: none; color: var(--text2); font-size: 14px; cursor: pointer; font-family: inherit; padding: 8px 0; }
    .btn-skip:hover { color: var(--text); }
    .btn-submit { background: var(--accent); color: #fff; border: none; padding: 12px 28px; border-radius: 24px; font-size: 15px; cursor: pointer; font-family: inherit; transition: opacity .2s; }
    .btn-submit:hover { opacity: .85; }
    .err { background: #fdf0ef; border: 1px solid #f5c6c2; border-radius: 8px; padding: 13px 18px; color: var(--red); margin-bottom: 14px; font-size: 14px; }

    /* ── Soft Landing ── */
    .soft-card { background: var(--paper); border: 1px solid var(--border); border-radius: var(--r); padding: 48px 44px; text-align: center; }
    .soft-icon { font-size: 36px; margin-bottom: 18px; }
    .soft-msg { font-family: 'Noto Serif SC', serif; font-size: 18px; line-height: 1.9; color: var(--text2); margin-bottom: 32px; max-width: 440px; margin-left: auto; margin-right: auto; }
    .btn-continue { background: var(--accent); color: #fff; border: none; padding: 12px 32px; border-radius: 24px; font-size: 15px; cursor: pointer; font-family: inherit; }
    .btn-continue:hover { opacity: .85; }

    /* ── Between ── */
    .between { background: var(--paper); border: 1px solid var(--border); border-radius: var(--r); padding: 44px; text-align: center; }
    .between-title { font-family: 'Noto Serif SC', serif; font-size: 22px; margin-bottom: 10px; }
    .between-desc { color: var(--text2); margin-bottom: 26px; line-height: 1.75; }
    .between-list { text-align: left; margin-bottom: 28px; }
    .between-item { border-left: 3px solid var(--accentl); padding: 8px 12px; margin-bottom: 8px; font-size: 14px; }
    .between-q { color: var(--text2); font-size: 12px; margin-bottom: 3px; }
    .between-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn-more { background: var(--accent); color: #fff; border: none; padding: 12px 28px; border-radius: 24px; font-size: 15px; cursor: pointer; font-family: inherit; }
    .btn-more:hover { opacity: .85; }
    .btn-rest { background: none; border: 1px solid var(--border); color: var(--text2); padding: 12px 28px; border-radius: 24px; font-size: 15px; cursor: pointer; font-family: inherit; }
    .btn-rest:hover { border-color: var(--text); color: var(--text); }

    /* ── Story ── */
    .story-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
    .story-hdr-title { font-family: 'Noto Serif SC', serif; font-size: 21px; }
    .btn-back { background: none; border: 1px solid var(--border); color: var(--text2); padding: 8px 18px; border-radius: 20px; font-size: 14px; cursor: pointer; font-family: inherit; }
    .btn-back:hover { border-color: var(--text); color: var(--text); }
    .story-body { background: var(--paper); border: 1px solid var(--border); border-radius: var(--r); padding: 52px 48px; font-family: 'Noto Serif SC', serif; font-size: 17px; line-height: 1.95; }
    .story-body h2 { font-size: 19px; color: var(--accent); margin: 34px 0 14px; font-weight: 600; }
    .story-body h2:first-child { margin-top: 0; }
    .story-body p { margin-bottom: 16px; }

    /* ── Actions ── */
    .action-btns { position: fixed; bottom: 18px; right: 18px; display: flex; gap: 8px; flex-direction: column; }
    .action-btn { background: none; border: 1px solid var(--border); color: var(--text2); padding: 5px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; font-family: inherit; opacity: .4; transition: opacity .2s; }
    .action-btn:hover { opacity: 1; }

    .hidden { display: none !important; }
    .prog-fill-init { width: 0%; }

    @media (max-width: 600px) {
      .main { padding: 24px 16px; }
      .welcome, .soft-card, .between { padding: 36px 24px; }
      .story-body { padding: 28px 20px; }
      .q-text { font-size: 18px; }
    }

    @media (max-width: 480px) {
      .hdr { padding: 10px 14px; }
      .hdr-title { font-size: 15px; }
      .hdr-prog { display: none; }
      .btn-gen { padding: 7px 14px; font-size: 13px; }

      .welcome { padding: 28px 18px; }
      .welcome-title { font-size: 22px; }
      .welcome-desc { font-size: 14px; }
      .btn-start { padding: 12px 32px; font-size: 15px; }

      .story-hdr { flex-direction: column; gap: 12px; align-items: flex-start; }

      .between-btns { flex-direction: column; }
      .btn-more, .btn-rest { width: 100%; text-align: center; }

      .q-foot { flex-direction: column-reverse; gap: 10px; align-items: stretch; }
      .btn-submit { text-align: center; }

      .action-btns { bottom: 12px; right: 12px; flex-direction: row; }
    }
    #auth-gate { position:fixed;inset:0;background:#faf9f7;display:flex;align-items:center;justify-content:center;z-index:9999; }
    .ag-center { text-align:center; }
    .ag-spinner { width:28px;height:28px;border:2px solid #e5e7eb;border-top-color:#a87c4f;border-radius:50%;animation:ag-s .8s linear infinite;margin:0 auto; }
    .ag-text { color:#9ca3af;font-size:13px;margin-top:12px;font-family:sans-serif; }
    #char-hint,#import-file { display:none; }
    .privacy-label { display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--text2);cursor:pointer; }
    .privacy-label input[type="checkbox"] { cursor:pointer; }
  </style>
  <style>
    /* 语言切换：main.js 给当前语言的按钮加 .active */
    .lang-sw { display:inline-flex; gap:2px; margin-right:8px; }
    .lang-sw button { background:none; border:none; cursor:pointer; font-size:12px; color:var(--text2); padding:2px 5px; border-radius:4px; }
    .lang-sw button:hover { color:var(--text); }
    .lang-sw button.active { color:var(--accent); font-weight:600; }
  </style>
</head>
<body data-page-title="ls_page_title">
<div id="auth-gate"><div class="ag-center"><div class="ag-spinner"></div><p class="ag-text" data-i18n="ag_verifying">验证身份中…</p></div></div>
<style>@keyframes ag-s{to{transform:rotate(360deg)}}</style>

<header class="hdr">
  <div class="hdr-left">
    <a href="../demo.html" class="back" data-i18n="ls_back">← 返回</a>
    <span class="hdr-title" data-i18n="ls_hdr_title">生平故事</span>
    <span class="hdr-prog" id="hdr-prog"></span>
  </div>
  <span class="lang-sw">
    <button type="button" data-lang="ja">日</button><button type="button" data-lang="zh">中</button><button type="button" data-lang="en">EN</button>
  </span>
  <button type="button" class="btn-gen" id="btn-gen" onclick="confirmGenStory()" disabled data-i18n="ls_btn_gen">生成我的故事</button>
</header>
<div class="prog-bar"><div class="prog-fill prog-fill-init" id="prog-fill"></div></div>

<main class="main">

  <!-- 欢迎 -->
  <section class="sec on" id="sec-welcome">
    <div class="welcome">
      <div class="welcome-icon">📖</div>
      <h1 class="welcome-title" id="w-title" data-i18n="ls_w_title">记录你的故事</h1>
      <p class="welcome-desc" id="w-desc">
        <span data-i18n="ls_w_desc1">我会提出一些问题，你用文字或语音回答。</span><br>
        <span data-i18n="ls_w_desc2">不需要一次说完，随时可以停下来。</span><br>
        <span data-i18n="ls_w_desc">当你觉得够了，AI 会为你写出一篇传记。</span>
      </p>
      <button type="button" class="btn-start" id="btn-start" onclick="nextTurn(null)" data-i18n="ls_btn_start">开始 →</button>
      <button type="button" class="btn-view-story hidden" id="btn-prev-story" onclick="showPrevStory()" data-i18n="ls_btn_prev_story">查看上次的故事</button>
    </div>
  </section>

  <!-- 分析中 -->
  <section class="sec" id="sec-loading">
    <div class="loading">
      <div class="spinner"></div>
      <span id="loading-msg" data-i18n="ls_loading_msg">正在思考下一个问题…</span>
    </div>
  </section>

  <!-- 答题 -->
  <section class="sec" id="sec-q">
    <div class="q-meta">
      <span class="q-cat" id="q-cat"></span>
      <span class="q-num" id="q-num"></span>
    </div>
    <p class="q-transition" id="q-transition"></p>
    <p class="q-text" id="q-text"></p>
    <div class="answer-box">
      <textarea class="answer-ta" id="q-ta" placeholder="在这里写下你的回答…" data-i18n-placeholder="ls_answer_placeholder" rows="5"></textarea>
      <div class="char-hint" id="char-hint"></div>
      <div class="answer-foot">
        <button type="button" class="btn-mic" id="btn-mic" onclick="toggleVoice()">
          <span class="mic-dot"></span>
          <span id="mic-lbl" data-i18n="ls_mic_lbl">语音输入</span>
        </button>
        <span class="char-ct" id="char-ct" data-i18n="ls_char_ct" data-i18n-n="0">0 字</span>
      </div>
      <label class="privacy-label">
        <input type="checkbox" id="privacy-chk"> 🔒 标记为隐私，不分析
      </label>
    </div>
    <div id="q-err"></div>
    <div class="q-foot">
      <button type="button" class="btn-skip" onclick="skipCurrent()" data-i18n="ls_btn_skip">跳过这题</button>
      <button type="button" class="btn-submit" onclick="submitAnswer()" data-i18n="ls_btn_submit">提交回答 →</button>
    </div>
  </section>

  <!-- 软着陆（拒答引导） -->
  <section class="sec" id="sec-soft">
    <div class="soft-card">
      <div class="soft-icon">○</div>
      <p class="soft-msg" id="soft-msg"></p>
      <button type="button" class="btn-continue" onclick="nextTurn(null)" data-i18n="ls_btn_continue">继续 →</button>
    </div>
  </section>

  <!-- 本轮结束 -->
  <section class="sec" id="sec-between">
    <div class="between">
      <div class="between-title" id="bw-title" data-i18n="ls_bw_title">这段到这里</div>
      <p class="between-desc" id="bw-desc"></p>
      <div class="between-list" id="bw-list"></div>
      <div class="between-btns">
        <button type="button" class="btn-more" onclick="nextTurn(null)" data-i18n="ls_btn_more">继续回答</button>
        <button type="button" class="btn-rest" onclick="restForNow()" data-i18n="ls_btn_rest">先到这里</button>
      </div>
    </div>
  </section>

  <!-- 故事 -->
  <section class="sec" id="sec-story">
    <div class="story-hdr">
      <h2 class="story-hdr-title" data-i18n="ls_story_hdr_title">我的生平故事</h2>
      <button type="button" class="btn-back" onclick="backFromStory()" data-i18n="ls_btn_back">← 返回</button>
    </div>
    <div id="story-wrap"></div>
  </section>

</main>

<div class="action-btns">
  <button type="button" class="action-btn" onclick="exportData()" data-i18n-title="ls_export_title" title="导出所有数据为 JSON" data-i18n="ls_export">导出</button>
  <button type="button" class="action-btn" onclick="document.getElementById('import-file').click()" data-i18n-title="ls_import_title" title="从 JSON 文件恢复数据" data-i18n="ls_import">导入</button>
  <button type="button" class="action-btn" onclick="resetAll()" data-i18n-title="ls_reset_title" title="清除所有数据，无法恢复" data-i18n="ls_reset">重置</button>
</div>
<input type="file" id="import-file" accept=".json" onchange="importData(event)">

<script src="../../js/main.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════════════════
// 问题库
// ══════════════════════════════════════════════════════════════════════════════

// 锚点题 — 覆盖人生大轮廓的必答骨架（按优先级排列）
// 取译文的快捷入口。main.js 未加载时回落成 key 本身，不让页面炸。
const t = (k) => (window.sdfT ? window.sdfT(k) : k);
// 访谈的追问/衔接/成稿都由模型生成，必须跟随界面语言——否则会出现
// 「日文的问题 + 中文的追问 + 中文的传记」。main.js 没加载时回落 zh。
const uiLang = () => (window.sdfLang ? window.sdfLang() : 'zh');

// cat 现在是**键**，不是显示文案。显示走 T 的 ls_cat_*（三语），
// 键则用于主题筛选和已答统计——这两件事此前共用一个中文字符串，
// 跟校对工具 CATS.label 是同一个陷阱。
const catLabel = (key) => t('ls_cat_' + key);

// 2026-08-19 之前 cat 存的是中文显示名，存档里还留着。不迁移的话，
// themeFilter='起点' 永远匹配不上 'origin' → 一道题都出不来，
// 而界面只会说"你已经回答了所有问题"，不报错。
const LEGACY_CAT = {
  起点:'origin', 家人:'family', 成长:'growing', 职业:'work', 转折:'turning',
  关系:'bonds', 挫折:'setback', 热忱:'passion', 内心:'inner', 价值观:'values',
  金钱:'money', 影响力:'influence', 遗憾:'regret', 印记:'mark', 传承:'legacy',
};

const ANCHORS = [
  { id:'a01', cat:'origin', text:{
    zh:'你是在哪里长大的？那个地方，塑造了你性格里的哪些东西？',
    ja:'どちらで育ちましたか。その土地は、あなたのどんなところを形づくったと思いますか。',
    en:'Where did you grow up? What did that place shape in you?' } },
  { id:'a02', cat:'family', text:{
    zh:'家里谁对你影响最深？那种影响，你现在还能感受到吗？',
    ja:'ご家族の中で、いちばん影響を受けたのはどなたですか。その影響は、今でも感じますか。',
    en:'Who in your family shaped you most? Can you still feel that today?' } },
  { id:'a03', cat:'growing', text:{
    zh:'成长过程中，有没有某件具体的事，让你意识到"世界和我想的不一样"？',
    ja:'育つ過程で、「世の中は自分が思っていたのとは違う」と気づいた出来事はありますか。',
    en:"Growing up, was there a moment when you realized the world wasn't what you thought?" } },
  { id:'a04', cat:'work', text:{
    zh:'你是怎么走上现在这条路的？是主动选择，还是被某些事情推着走的？',
    ja:'今の道に進むことになったきっかけは何でしたか。ご自分で選んだものでしたか、それとも何かに押されて進んだものでしたか。',
    en:'How did you end up on your path? Did you choose it, or were you pushed there?' } },
  { id:'a05', cat:'turning', text:{
    zh:'你人生里有没有一个决定，回头看是真正的分叉口？那时候你是怎么做决定的？',
    ja:'振り返ってみて、ここが本当の分かれ道だったと思う決断はありますか。そのとき、どうやって決めましたか。',
    en:'Looking back, was there a decision that turned out to be a real fork in the road? How did you decide?' } },
  { id:'a06', cat:'bonds', text:{
    zh:'对你来说，最重要的关系是什么样的？可以是任何形式的。',
    ja:'あなたにとっていちばん大切な関係は、どんな関係ですか。どんな形のものでもかまいません。',
    en:'What does your most important relationship look like? It can be any kind.' } },
  { id:'a07', cat:'setback', text:{
    zh:'你有没有经历过一次彻底的失败或溃败？那段日子是怎么过的？',
    ja:'すっかりうまくいかなくなった、という経験はありますか。その時期は、どう過ごされましたか。',
    en:'Have you ever failed completely? How did you get through that time?' } },
  { id:'a08', cat:'passion', text:{
    zh:'什么事情是你做起来完全不需要理由的？这个答案，有没有随时间变过？',

const SK = 'lifestory_v2';

function defState() {
  return {
    answers:       [],  // [{id, type, cat, question, answer, analysis, timestamp, privacy}]
    usedIds:       [],  // 所有已出现的题目 ID（含跳过）
    anchorsDone:   [],  // 已答完的锚点 ID
    tags:          [],  // 累积的用户标签
    historicalUsed: 0,  // 历史时空题使用次数（上限 2）
    followupCount: 0,   // 当前锚点已追问次数（上限见 decideProbe）
    lastAnalysis:  null,
    lastStory:     null,
    draft:         { qId: null, text: '', privacy: false },
    themeFilter:   null,  // 主题筛选（null = 不筛选，或 category 名称）
  };
}

let state;
let currentQ   = null;  // 当前题目对象
let prevSec    = 'sec-welcome';
let recognition = null;
let isRec      = false;
let recTimer   = null;
let recSeconds = 0;
let recRetries = 0;  // 语音识别重试次数

/**
 * 把 2026-08-19 之前存的中文 cat 值迁成新的键。
 *
 * 不迁的后果不是报错，是**静默失灵**：themeFilter 停在 '起点'，
 * 而题库里现在写的是 'origin'，于是 nextQuestion 一道题也找不到，
 * 界面显示「你已经回答了所有问题」——正在做的访谈就这么断了。
 */
function migrateCats(s) {
  if (!s || typeof s !== 'object') return s;
  if (s.themeFilter && LEGACY_CAT[s.themeFilter]) s.themeFilter = LEGACY_CAT[s.themeFilter];
  if (Array.isArray(s.answers)) {
    for (const a of s.answers) if (a && LEGACY_CAT[a.cat]) a.cat = LEGACY_CAT[a.cat];
  }
  return s;
}

function loadState()  { try { return migrateCats(JSON.parse(localStorage.getItem(SK))) || defState(); } catch (err) { console.warn('存档读取失败，从空白开始：', err); return defState(); } }
function saveState()  { localStorage.setItem(SK, JSON.stringify(state)); }

// ══════════════════════════════════════════════════════════════════════════════
// 路由引擎 — 决定下一道题
// ══════════════════════════════════════════════════════════════════════════════

function pickNext(analysis) {
  const { usedIds, historicalUsed, themeFilter } = state;

  // 主题筛选函数
  const matchesTheme = (q) => {
    if (!themeFilter) return true;
    return q.cat === themeFilter;
  };

  // 优先级 1：历史时空催化（满足年份+地点，且全程 < 2 次）
  if (analysis && !analysis.isEvasion && historicalUsed < 2 && analysis.year) {
    const hist = historicalBank().find(h => {
      if (usedIds.includes(h.id)) return false;
      const inRange = analysis.year >= h.yearRange[0] && analysis.year <= h.yearRange[1];
      if (!inRange) return false;
      if (!h.locations) return true;
      return !analysis.location || h.locations.some(l => analysis.location.includes(l));
    });
    if (hist && matchesTheme(hist)) {
      state.historicalUsed++;
      const text = qText(hist)
        .replace('{location}', analysis.location || t('ls_that_place'))
        .replace('{year}', String(analysis.year));
      return { ...hist, type: 'historical', text };
    }
  }

  // 优先级 3：下一道锚点题
  // text 在这里就解析成字符串——下游（渲染、存档、传给模型）拿到的一律是字符串，
  // 不用到处判断"这是不是三语对象"。
  const anchor = ANCHORS.find(q => !usedIds.includes(q.id) && matchesTheme(q));
  if (anchor) return { ...anchor, type: 'anchor', text: qText(anchor) };

  return null;
}

// Authenticated fetch — attaches the current user's Firebase ID token.
// window.sdfGetToken is exposed by the firebase auth module at the bottom.
async function apiFetch(url, opts = {}) {
  const token = await window.sdfGetToken?.();
  return fetch(url, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: `Bearer ${token}` },
  });
}

async function callProbe(question, answer) {
  const res = await apiFetch('/api/lifestory', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      action: 'probe',
      question, answer,
      recentHistory: state.answers.slice(-4),
      knownTags: state.tags,
      lang: uiLang(),
    }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data; // { analysis, followup }
}

async function callBridge(lastAnswer, nextQuestion) {
  const res = await apiFetch('/api/lifestory', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'bridge', lastAnswer, nextQuestion, lang: uiLang() }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data.bridge || '';
}

async function confirmGenStory() {
  const n = state.answers.length;
  const privateN = state.answers.filter(a => a.privacy).length;
  const cats = new Set(state.answers.map(a => a.cat)).size;

  const summary = t('ls_gen_summary').replace('{n}', n) +
    `${privateN > 0 ? t('ls_privacy_note').replace('{n}', privateN) : ``}` +
    t('ls_gen_summary_cats').replace('{n}', cats);

  if (confirm(summary + '\n\n' + t('ls_gen_confirm'))) {
    await genStory();
  }
}

async function genStory() {
  if (!state.answers.length) return;
  prevSec = document.querySelector('.sec.on')?.id || 'sec-welcome';
  show('sec-story');

  let progressEl = document.getElementById('story-wrap');
  progressEl.innerHTML = `<div class="loading"><div class="spinner"></div><span>${t('ls_writing')}</span><div style="font-size:12px; color:var(--text2); margin-top:8px;">${t('ls_writing_note')}</div></div>`;

  let progressTimer = setInterval(() => {
    const dots = progressEl.querySelector('span');
    if (dots) {
      const text = dots.textContent;
      if (text.endsWith('…')) {
        window.sdfSetText(dots, 'ls_writing');
      } else {
        dots.textContent += '…';
      }
    }
  }, 1000);

  try {
    const ctrl = new AbortController();
    const timeoutId = setTimeout(() => ctrl.abort(), 90000);  // 90 秒超时

    const res = await apiFetch('/api/lifestory', {
      method: 'POST',
      signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'story', answers: state.answers, lang: uiLang() }),
    });

    clearTimeout(timeoutId);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    state.lastStory = data.story;
    saveState();
    clearInterval(progressTimer);
    renderStory(data.story);
  } catch (e) {
    clearInterval(progressTimer);
    const errMsg = e.name === 'AbortError'
      ? t('ls_gen_timeout')
      : t('ls_gen_failed') + e.message;
    document.getElementById('story-wrap').innerHTML =
      `<div class="err">${errMsg}<br><button onclick="genStory()" style="margin-top:10px; padding:6px 16px; background:var(--accent); color:#fff; border:none; border-radius:16px; cursor:pointer; font-size:13px;">${t('ls_regenerate')}</button></div>`;
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// 主流程
// ══════════════════════════════════════════════════════════════════════════════

// nextTurn：选下一道题，如有 lastAnswer 则生成衔接语
async function nextTurn(analysis, lastAnswer) {
  show('sec-loading');
  document.getElementById('loading-msg').textContent =
    lastAnswer ? t('ls_loading_msg') : t('ls_loading_first');

  const next = pickNext(analysis);
  if (!next) {
    const msg = state.themeFilter
      ? t('ls_theme_done').replace('{cat}', catLabel(state.themeFilter))
      : t('ls_all_answered');
    showBetween(msg, true);
    return;
  }

  currentQ = next;
  if (!state.usedIds.includes(next.id)) state.usedIds.push(next.id);
  saveState();

  // 知道下一题后，才生成精准衔接语
  let bridge = '';
  if (lastAnswer && !analysis?.isEvasion) {
    try { bridge = await callBridge(lastAnswer, next.text); }
    catch { bridge = ''; }
  }

  showQ(next, bridge);
}

function showQ(q, transition) {
  // 展示非追问题（锚点/历史题）即进入新锚点，重置本锚点追问计数；
  // 覆盖所有换题路径（含回避软着陆、每8题提示后继续），避免追问额度跨锚点泄漏。
  if (q.type !== 'followup') state.followupCount = 0;
  document.getElementById('q-cat').textContent = catLabel(q.cat);
  window.sdfSetText(document.getElementById('q-num'), 'ls_q_num', state.answers.length + 1);
  document.getElementById('q-transition').textContent = transition || '';
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('q-ta').value = '';
  document.getElementById('privacy-chk').checked = false;
  window.sdfSetText(document.getElementById('char-ct'), 'ls_char_ct', 0);
  document.getElementById('char-hint').style.display = 'none';
  document.getElementById('q-err').innerHTML = '';

  // 检查是否有未提交的草稿
  if (state.draft.qId === q.id && state.draft.text) {
    const msg = document.getElementById('q-err');
    msg.innerHTML = `<div class="err">${t('ls_restored')}</div>`;
    document.getElementById('q-ta').value = state.draft.text;
    document.getElementById('privacy-chk').checked = state.draft.privacy;
    state.draft = { qId: null, text: '', privacy: false };
    updateCount();
  }

  show('sec-q');
  document.getElementById('q-ta').focus();
}

async function submitAnswer() {
  const answer = document.getElementById('q-ta').value.trim();
  if (!answer) {
    document.getElementById('q-err').innerHTML =
      `<div class="err">${t('ls_need_answer')}</div>`;
    return;
  }

  const privacy = document.getElementById('privacy-chk').checked;
  state.draft = { qId: currentQ.id, text: answer, privacy };
  saveState();

  show('sec-loading');
  window.sdfSetText(document.getElementById('loading-msg'), 'ls_understanding');

  let analysis, probeResult;
  try {
    // 如果标记为隐私，只保存不分析
    if (privacy) {
      probeResult = { analysis: { tags:[], year:null, location:null, isEvasion:false, evasionType:null, softLanding:null }, followup: { ask:false, question:'' } };
    } else {
      probeResult = await callProbe(currentQ.text, answer);
    }
    analysis = probeResult.analysis;
  } catch (err) {
    // 网络失败：显示重试对话框
    show('sec-q');
    const msg = document.getElementById('q-err');
    msg.innerHTML = `<div class="err">${t('ls_submit_failed')}${err.message}<br><button onclick="submitAnswer()" style="margin-top:10px; padding:6px 16px; background:var(--accent); color:#fff; border:none; border-radius:16px; cursor:pointer; font-size:13px;">${t('ls_retry')}</button></div>`;
    return;
  }

  // 累积标签
  if (analysis.tags?.length) {
    state.tags = [...new Set([...state.tags, ...analysis.tags])];
  }
  state.lastAnalysis = analysis;

  if (analysis.isEvasion) {
    // 软着陆：记录跳过，不保存到 answers
    if (!state.usedIds.includes(currentQ.id)) state.usedIds.push(currentQ.id);
    state.draft = { qId: null, text: '', privacy: false };
    saveState();
    showSoftLanding(analysis.softLanding);
    return;
  }

  // 保存正式回答
  state.answers.push({
    id: currentQ.id,
    type: currentQ.type,
    cat: currentQ.cat,
    question: currentQ.text,
    answer,
    analysis,
    timestamp: new Date().toISOString(),
    privacy,
  });
  if (currentQ.type === 'anchor') {
    if (!state.anchorsDone.includes(currentQ.id)) state.anchorsDone.push(currentQ.id);
  }
  state.draft = { qId: null, text: '', privacy: false };
  saveState();
  updateHdr();

  // 每答完 8 题提示一次"可以生成故事了"
  if (state.answers.length > 0 && state.answers.length % 8 === 0) {
    showBetween(t('ls_can_gen_now').replace('{n}', state.answers.length), false);
    return;
  }

  const step = window.sdfDecideProbe(probeResult, state.followupCount || 0, 2);
  if (step === 'ask') {
    state.followupCount = (state.followupCount || 0) + 1;
    const fq = { id: 'fu-' + Date.now(), type: 'followup', cat: currentQ.cat, text: probeResult.followup.question };
    saveState();
    let bridge = '';
    try { bridge = await callBridge(answer, fq.text); } catch { bridge = ''; }
    currentQ = fq;
    showQ(fq, bridge);
  } else {
    state.followupCount = 0;
    saveState();
    await nextTurn(analysis, answer);
  }
}

function skipCurrent() {
  if (!state.usedIds.includes(currentQ.id)) state.usedIds.push(currentQ.id);
  if (currentQ.type === 'anchor') state.anchorsDone.push(currentQ.id);
  saveState();
  nextTurn(null);
}

function showSoftLanding(msg) {
  const defaultMsg = t('ls_soft_landing');
  document.getElementById('soft-msg').textContent = msg || defaultMsg;
  show('sec-soft');
}

function showBetween(desc, allDone) {
  const n = state.answers.length;
  document.getElementById('bw-title').textContent = allDone ? t('ls_well_done') : t('ls_good_pause');
  document.getElementById('bw-desc').textContent = desc || t('ls_shared_n').replace('{n}', n);

  const recent = state.answers.slice(-3);
  document.getElementById('bw-list').innerHTML = recent.map(a => `
    <div class="between-item">
      <div class="between-q">${a.question}</div>
      <div>${a.answer.length > 60 ? a.answer.slice(0, 60) + '…' : a.answer}</div>
    </div>`).join('');

  const btnMore = document.querySelector('.btn-more');
  const btnRest = document.querySelector('.btn-rest');

  if (allDone) {
    if (state.themeFilter) {
      // 主题筛选完成：显示清除筛选或生成故事
      window.sdfSetText(btnMore, 'ls_clear_filter_continue');
      btnMore.onclick = () => { state.themeFilter = null; saveState(); nextTurn(null); };
      window.sdfSetText(btnRest, 'ls_gen_story');
      btnRest.onclick = () => confirmGenStory();
    } else {
      // 全部答完
      btnMore.style.display = 'none';
      window.sdfSetText(btnRest, 'ls_gen_story');
      btnRest.onclick = () => confirmGenStory();
    }
  } else {
    window.sdfSetText(btnMore, 'ls_btn_more');
    btnMore.onclick = () => nextTurn(null);
    btnMore.style.display = '';
    window.sdfSetText(btnRest, 'ls_btn_rest');
    btnRest.onclick = () => restForNow();
  }
  show('sec-between');
}

function restForNow() {
  const n = state.answers.length;
  window.sdfSetText(document.getElementById('w-title'), 'ls_today_enough');

  // 收集已答过的主题，建议用户选择不同的主题继续
  const answeredCats = new Set(state.answers.map(a => a.cat));
  const availableCats = [...new Set([...ANCHORS].map(q => q.cat))]
    .filter(cat => !answeredCats.has(cat));

  let descHtml = t('ls_shared_n').replace('{n}', n) + '<br>' + t('ls_come_back');
  let btnHtml = `<button type="button" class="btn-start" onclick="nextTurn(null)" style="margin-top:12px;">${t('ls_btn_continue')}</button>`;

  if (availableCats.length > 0 && availableCats.length <= 5) {
    descHtml += `<br><br><strong style="display:block; margin-top:12px; font-size:14px; color:var(--text);">${t('ls_or_pick_theme')}</strong>`;
    const catBtns = availableCats.map(cat =>
      `<button type="button" class="btn-start" onclick="setThemeFilter('${cat}'); nextTurn(null);" style="margin:8px 6px 0 0; padding:8px 16px; font-size:13px; background:var(--accentl); color:var(--accent);">${t('ls_only_theme').replace('{cat}', catLabel(cat))}</button>`
    ).join('');
    btnHtml = `<div style="margin-top:16px;">${catBtns}<br>${btnHtml}</div>`;
  }

  document.getElementById('w-desc').innerHTML = descHtml + btnHtml;
  window.sdfSetText(document.getElementById('btn-start'), 'ls_all_continue');
  show('sec-welcome');
}

function setThemeFilter(theme) {
  state.themeFilter = theme;
  saveState();
  document.getElementById('w-desc').innerHTML = `<div style="font-size:14px; color:var(--text2);">${t('ls_filtered').replace('{theme}', `<strong>${catLabel(theme)}</strong>`)}<br><button type="button" style="margin-top:8px; padding:6px 12px; background:none; border:1px solid var(--border); border-radius:16px; font-size:12px; cursor:pointer; color:var(--text2);" onclick="state.themeFilter=null; saveState(); restForNow();">${t('ls_clear_filter')}</button></div>`;
}

function backFromStory() { show(prevSec); }

function showPrevStory() {
  if (state.lastStory) { renderStory(state.lastStory); prevSec = 'sec-welcome'; show('sec-story'); }
}

function renderStory(md) {
  // AI 输出转 HTML 后必须过 DOMPurify 消毒再进 innerHTML（防 XSS）
  const html =
    typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined'
      ? DOMPurify.sanitize(marked.parse(md))
      : String(md).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
  document.getElementById('story-wrap').innerHTML = `<div class="story-body">${html}</div>`;
}

function exportData() {
  if (!state.answers.length) {
    alert(t('ls_no_data'));
    return;
  }
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `lifestory-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  alert(t('ls_downloaded'));
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);

      // 数据验证：检查必要字段
      if (!imported.answers || !Array.isArray(imported.answers)) {
        throw new Error(t('ls_bad_format'));
      }

      if (!confirm(t('ls_confirm_import').replace('{n}', imported.answers.length))) {
        return;
      }

      // 合并或覆盖：若当前有数据，提示选择
      if (state.answers.length > 0) {
        if (!confirm(t('ls_confirm_overwrite').replace('{n}', state.answers.length))) {
          return;
        }
        // 如果用户点击确定，则覆盖
      }

      // 覆盖状态
      state = imported;
      // 确保必要字段存在
      if (!state.draft) state.draft = { qId: null, text: '', privacy: false };
      if (!state.themeFilter) state.themeFilter = null;
      saveState();
      updateHdr();

      // 刷新页面以更新 UI
      alert(t('ls_imported').replace('{n}', state.answers.length));
      location.reload();
    } catch (err) {
      alert(t('ls_import_failed') + err.message);
    }
  };
  reader.readAsText(file);

  // 重置文件输入，以便下次可以导入同一文件
  event.target.value = '';
}

function resetAll() {
  if (!confirm(t('ls_confirm_reset'))) return;
  localStorage.removeItem(SK);
  location.reload();
}

// ══════════════════════════════════════════════════════════════════════════════
// 语音
// ══════════════════════════════════════════════════════════════════════════════

function initRec() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return false;
  recognition = new SR();
  recognition.lang = 'zh-CN';
  recognition.continuous = true;   // 不自动停止，手动控制
  recognition.interimResults = true;
  return true;
}

function startRecTimer() {
  recSeconds = 0;
  recTimer = setInterval(() => {
    recSeconds++;
    window.sdfSetText(document.getElementById('mic-lbl'), 'ls_recording', recSeconds);
  }, 1000);
}

function stopRecTimer() {
  if (recTimer) { clearInterval(recTimer); recTimer = null; }
  window.sdfSetText(document.getElementById('mic-lbl'), 'ls_mic_lbl');
}

function toggleVoice() {
  if (!recognition && !initRec()) { alert(t('ls_no_speech')); return; }
  if (isRec) { recognition.stop(); return; }

  const ta  = document.getElementById('q-ta');
  const btn = document.getElementById('btn-mic');
  const accumulated = ta.value;
  let finalBuffer = '';
  let shouldRetry = false;

  recognition.onstart = () => {
    isRec = true;
    btn.classList.add('rec');
    startRecTimer();
    shouldRetry = false;
  };
  recognition.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalBuffer += e.results[i][0].transcript;
      else interim = e.results[i][0].transcript;
    }
    ta.value = accumulated + finalBuffer + interim;
    updateCount();
    if (finalBuffer) shouldRetry = false;  // 有结果就不重试
  };
  recognition.onend = () => {
    isRec = false;
    btn.classList.remove('rec');
    stopRecTimer();
    ta.value = accumulated + finalBuffer;
    updateCount();
    // 如果应该重试且次数未超限，自动重新启动
    if (shouldRetry && recRetries < 2) {
      recRetries++;
      window.sdfSetText(document.getElementById('mic-lbl'), 'ls_reconnecting', recRetries);
      setTimeout(() => toggleVoice(), 500);
    } else {
      recRetries = 0;
    }
  };
  recognition.onerror = (e) => {
    stopRecTimer();
    const retryableErrors = ['network', 'no-speech', 'audio-capture'];
    shouldRetry = retryableErrors.includes(e.error);
    if (e.error === 'aborted') {
      isRec = false;
      btn.classList.remove('rec');
    }
    // 不立即显示错误，等 onend 触发后决定是否重试
  };
  recognition.start();
}

function updateCount() {
  const len = document.getElementById('q-ta').value.length;
  window.sdfSetText(document.getElementById('char-ct'), 'ls_char_ct', len);

  const hint = document.getElementById('char-hint');
  if (len === 0) {
    hint.style.display = 'none';
  } else if (len < 20) {
    hint.className = 'char-hint short';
    window.sdfSetText(hint, 'ls_hint_short');
    hint.style.display = 'block';
  } else if (len < 100) {
    hint.className = 'char-hint good';
    window.sdfSetText(hint, 'ls_hint_ok');
    hint.style.display = 'block';
  } else if (len < 500) {
    hint.className = 'char-hint long';
    window.sdfSetText(hint, 'ls_hint_long');
    hint.style.display = 'block';
  } else {
    hint.className = 'char-hint toolong';
    window.sdfSetText(hint, 'ls_hint_too_long');
    hint.style.display = 'block';
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// 工具
// ══════════════════════════════════════════════════════════════════════════════

function show(id) {
  document.querySelectorAll('.sec').forEach(s => s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}

function updateHdr() {
  const n = state.answers.length;
  let remaining = 0;

  // 计算剩余题目数
  if (state.themeFilter) {
    remaining = [...ANCHORS, ...historicalBank()]
      .filter(q => !state.usedIds.includes(q.id) && q.cat === state.themeFilter)
      .length;
  } else {
    remaining = [...ANCHORS, ...historicalBank()]
      .filter(q => !state.usedIds.includes(q.id))
      .length;
  }

  const progText = n ? t('ls_answered').replace('{n}', n) : '';
  const remText = remaining > 0 ? t('ls_remaining').replace('{n}', remaining) : '';
  document.getElementById('hdr-prog').textContent = progText + remText;
  document.getElementById('btn-gen').disabled = n === 0;
  document.getElementById('prog-fill').style.width = `${Math.min(n / 15 * 100, 100)}%`;
}

// ══════════════════════════════════════════════════════════════════════════════
// 初始化
// ══════════════════════════════════════════════════════════════════════════════

state = loadState();
updateHdr();

if (state.answers.length > 0) {
  const cats = new Set(state.answers.map(a => a.cat)).size;
  const chars = state.answers.reduce((sum, a) => sum + a.answer.length, 0);

  window.sdfSetText(document.getElementById('w-title'), 'ls_welcome_back');
  document.getElementById('w-desc').innerHTML =
    t('ls_sum_shared').replace('{n}', `<strong>${state.answers.length}</strong>`) + '<br>' +
    t('ls_sum_themes').replace('{c}', `<strong>${cats}</strong>`).replace('{n}', `<strong>${Math.round(chars/1000)*1000 || chars}</strong>`) + '<br>' +
    t('ls_sum_ready');
  window.sdfSetText(document.getElementById('btn-start'), 'ls_btn_continue');
  if (state.lastStory) document.getElementById('btn-prev-story').classList.remove('hidden');
}

document.getElementById('q-ta').addEventListener('input', updateCount);
</script>
