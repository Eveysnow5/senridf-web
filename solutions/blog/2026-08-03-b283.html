  <script type="application/json" id="article-data">{"ja":{"title":"『愛（AI）とあなたのあいだ』FIRST最優秀長編ドキュメンタリー賞、最終候補5作品に選出","body":"\u003cp>2026年7月、ドキュメンタリー長編映画『愛（AI）とあなたのあいだ』（AI MEANS LOVE）が第20回FIRST青年映画祭のコンペティション部門にノミネートされ、映画祭期間中にワールドプレミアを果たしました。同作品の執行監督である楊雪は主要スタッフの一員として、中国西寧市で開催された本映画祭に参加しました。\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cimg src=\"/assets/images/blog/inline-1792856473313-68e82f.webp\" alt=\"\">\u003c/p>\u003cp>\u003ci style=\"font-size: 14px;\">写真：第20回FIRST青年映画祭に登場した『愛（AI）とあなたのあいだ』の主要スタッフチーム。画像出典：FIRST青年映画祭公式。\u003c/i>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>FIRST青年映画祭は2006年に創設され、独立した創作精神と探求意識を持つ若手映画作家に長年注目してきた、中国を代表する若手映画創作交流プラットフォームの一つです。2012年にコンペティション部門が新設されて以来、FIRSTは作品募集、審査、上映、業界交流を通じて、新たな世代の映画創作に展示と交流の場を提供し続けています。\u003c/p>\u003cp>今年の映画祭は7月17日から25日まで西寧市で開催されました。『愛（AI）とあなたのあいだ』はコンペティション部門の長編リストに選出され、ノミネートされた5本のドキュメンタリー長編の一つとなりました。\u003c/p>\u003cp>【添付画像：FIRST公式コンペティション部門長編ノミネートリスト】\u003c/p>\u003ch3>AIが親密な関係の橋渡しに\u003c/h3>\u003cp>『愛（AI）とあなたのあいだ』は、上映時間90分の中国のドキュメンタリー映画です。\u003c/p>\u003cp>本作はAIデザイナー・胡仁亮の実体験に焦点を当てています。父の愛の欠如は、彼の成長過程における癒えにくい傷であり、家族とのつながりへの執着も常に彼の中にありました。\u003c/p>\u003cp>2023年、胡仁亮は「AIおばあちゃん」を作成したことにより大きな注目を集めました。彼は偶然にも、人工知能技術によって再現されたおばあちゃんの姿が、自分と長年の隔たりがあった父親をも動かしていることに気づきます。\u003c/p>\u003cp>これを受け、彼は父子間で崩れかけている関係を修復するために、より完成度の高い「AIおばあちゃん」2.0の制作を決意し、デジタル技術の力を借りることにしました。\u003c/p>\u003cp>しかし、技術的な実現よりも、長年にわたり蓄積された家庭内の葛藤、価値観の違い、そして感情的なトラウマの方が、乗り越えるのがより困難な障害となっていました。\u003c/p>\u003cp>本作はAIによる復活を切り口とし、カメラの焦点を技術実験から現実の人間関係へと移します。技術が亡くなった親族の姿や声を再現できるなら、それはまだ生きている人々が互いを再び理解する助けにもなるのでしょうか？\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cimg src=\"/assets/images/blog/inline-1792856496195-671b70.webp\" alt=\"\">\u003c/p>\u003cp>\u003cspan style=\"font-size: 14px;\">\u003ci>写真：映画『愛（AI）とあなたのあいだ』の公式ポスター。\u003c/i>\u003c/span>\u003cspan style=\"font-size: 14px;\">\u003ci>\u003ca href=\"https://weibo.com/tv/show/1034:5318448939729064\">予告編を見る。\u003c/a>\u003c/i>\u003c/span>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>今年のFIRSTにおけるノミネート作品全体の観察では、テクノロジーが感情に介入することは、注目すべき創作テーマの一つと見なされています。人工知能が人間の記憶、親密な関係、感情表現の領域に徐々に浸透するにつれ、技術が変えているのは生産様式や生活様式だけでなく、人々が互いを理解し反応する方法も含んでいます。\u003c/p>\u003cp>『愛（AI）とあなたのあいだ』は、ある実在の家庭の経験を通じて、この時代的課題に対して具体的かつ微細な観察の視点を提供しています。\u003c/p>\u003ch3>ニュース調査からドキュメンタリー映像へ\u003c/h3>\u003cp>楊雪は監督・銭弈成の招待を受けて作品の主要スタッフチームに参加し、プロジェクトの初期インタビュー段階から、作品の制作および関連する制作業務に関わり続けてきました。\u003c/p>\u003cp>それ以前、彼女は中国の複数の新聞機関で10年以上ジャーナリストとして活動し、調査報道、深い人物インタビュー、コンテンツ制作に長く従事してきました。その後、日本にて千里同風株式会社を設立し、現在代表取締役を務めています。\u003c/p>\u003cp>ニュース調査からドキュメンタリー映像、さらには人工知能分野での起業実践に至るまで、実在の人物に対する継続的な観察、複雑な情報の調査と整理、そして技術的社会影響への関心は、彼女の分野横断的なキャリアを通じて一貫して貫かれています。\u003c/p>\u003cp>2025年5月、本作は『愛とあなたのあいだ』（All I Want）というタイトルで、フレッシュピッチ・リリー真実映像大会（FreshPitch）に選出され、楊雪は副監督兼プロジェクト提案者として大会活動に参加しました。\u003c/p>\u003cp>2026年7月、本作の完成に伴い、FIRSTコンペティション部門へのノミネートが決まりました。\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cimg src=\"/assets/images/blog/inline-1792856507804-0c5076.webp\" alt=\"\">\u003c/p>\u003cp>\u003cspan style=\"font-size: 14px;\">\u003ci>写真：第20回FIRST青年映画祭に登場した『愛（AI）とあなたのあいだ』の主要スタッフチーム。画像出典：FIRST青年映画祭公式。\u003c/i>\u003c/span>\u003c/p>\u003ch3>\u003cbr>\u003c/h3>\u003ch3>作品情報\u003c/h3>\u003cp>作品名：『愛（AI）とあなたのあいだ』\u003cbr>英題：AI MEANS LOVE\u003cbr>監督：銭弈成\u003cbr>執行監督：楊雪（First Assistant Director）\u003cbr>ジャンル：ドキュメンタリー長編\u003cbr>上映時間：90分\u003cbr>製作年：2026年\u003cbr>初上映：ワールドプレミア\u003cbr>ノミネート：第20回FIRST青年映画祭コンペティション部門\u003c/p>\u003cp>FIRST公式作品アーカイブ：\u003c/p>\u003cp>https://www.firstfilm.org.cn/movies/film-library/aimeanslove/\u003c/p>\u003cp>\u003ci>\u003cbr>\u003c/i>\u003c/p>\u003cp>\u003ci>\u003cbr>\u003c/i>\u003c/p>\u003cp>\u003ci>注：楊雪は日本で通称「南雪」（Minami Yuki）として知られています。\u003c/i>\u003c/p>","tag":""},"zh":{"title":"纪录长片《爱（AI）和你之间》入围第20届FIRST青年电影展主竞赛单元","body":"\u003cp>2026年7月，纪录长片《爱（AI）和你之间》（AI MEANS LOVE）入围第20届FIRST青年电影展主竞赛单元，并于电影展期间迎来世界首映。影片执行导演杨雪作为主创团队成员之一，出席了在中国西宁举办的本届电影展。\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cimg src=\"/assets/images/blog/inline-1792856473313-68e82f.webp\" alt=\"\">\u003c/p>\u003cp>\u003ci style=\"font-size: 14px;\">图：《爱（AI）和你之间》主创团队亮相第20届FIRST青年电影展。图片来源：FIRST青年电影展官方。\u003c/i>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>FIRST青年电影展创办于2006年，是中国具有代表性的青年电影创作交流平台之一，长期关注具有独立创作精神与探索意识的青年电影人。自2012年增设主竞赛单元以来，FIRST持续通过影片征集、评审、展映及行业交流，为新生代电影创作提供展示与交流的平台。\u003c/p>\u003cp>本届电影展于7月17日至25日在西宁举行。《爱（AI）和你之间》入选主竞赛长片名单，是五部入围最佳纪录长片之一。\u003c/p>\u003cp>【配图：FIRST官方主竞赛长片入围名单】\u003c/p>\u003ch3>当AI成为亲情的桥梁\u003c/h3>\u003cp>《爱（AI）和你之间》是一部片长90分钟的中国纪录电影。\u003c/p>\u003cp>影片聚焦AI设计师胡仁亮的真实经历。父爱的缺失，是他成长过程中难以弥合的伤痕，也让他始终怀有对亲情联结的执念。\u003c/p>\u003cp>2023年，胡仁亮因制作「AI奶奶」受到广泛关注。他意外发现，通过人工智能技术重现的奶奶形象，也触动了与自己长期存在隔阂的父亲。\u003c/p>\u003cp>由此，他决定制作更加完善的「AI奶奶」2.0，希望借助数字技术，修复父子之间濒临破裂的关系。\u003c/p>\u003cp>然而，相比技术实现本身，多年积累的家庭矛盾、价值观差异与情感创伤，构成了更难以跨越的障碍。\u003c/p>\u003cp>影片以AI复生为切入点，将镜头从技术实验转向真实的人际关系：当技术能够重现逝去亲人的形象与声音，它是否也能够帮助仍然活着的人重新理解彼此？\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cimg src=\"/assets/images/blog/inline-1792856496195-671b70.webp\" alt=\"\">\u003c/p>\u003cp>\u003cspan style=\"font-size: 14px;\">\u003ci>图：《爱（AI）和你之间》电影官方海报。\u003c/i>\u003c/span>\u003cspan style=\"font-size: 14px;\">\u003ci>\u003ca href=\"https://weibo.com/tv/show/1034:5318448939729064\">观看影片预告片。\u003c/a>\u003c/i>\u003c/span>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>在本届FIRST对入围作品的整体观察中，科技对情感的介入被视为值得关注的创作主题之一。随着人工智能逐渐进入人类记忆、亲密关系与情感表达的领域，技术所改变的已不只是生产和生活方式，也包括人们理解与回应彼此的方式。\u003c/p>\u003cp>《爱（AI）和你之间》以一个真实家庭的经历，为这一时代议题提供了具体而细微的观察视角。\u003c/p>\u003ch3>从新闻调查到纪录影像\u003c/h3>\u003cp>杨雪受导演钱弈成邀请加入影片主创团队，自项目前期采访阶段起，持续参与影片创作及相关制作工作。\u003c/p>\u003cp>在此之前，她曾于中国多家新闻机构从事十余年新闻工作，长期参与调查报道、深度人物采访及内容创作。此后，她在日本创立千里同風株式会社，现任代表取締役。\u003c/p>\u003cp>从新闻调查到纪录影像，再到人工智能领域的创业实践，对真实人物的持续观察、复杂信息的调查与梳理，以及对技术社会影响的关注，贯穿于其跨领域的工作经历。\u003c/p>\u003cp>2025年5月，影片曾以《爱和你之间》（All I Want）为名，入选新鲜提案·黎里真实影像大会（FreshPitch），杨雪作为影片副导演及项目提案人参与大会活动。\u003c/p>\u003cp>2026年7月，影片完成并入围FIRST主竞赛。\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cimg src=\"/assets/images/blog/inline-1792856507804-0c5076.webp\" alt=\"\">\u003c/p>\u003cp>\u003cspan style=\"font-size: 14px;\">\u003ci>图：《爱（AI）和你之间》主创团队亮相第20届FIRST青年电影展。图片来源：FIRST青年电影展官方。\u003c/i>\u003c/span>\u003c/p>\u003ch3>\u003cbr>\u003c/h3>\u003ch3>影片信息\u003c/h3>\u003cp>片名：《爱（AI）和你之间》\u003cbr>英文片名：AI MEANS LOVE\u003cbr>导演：钱弈成\u003cbr>执行导演：杨雪（First Assistant Director）\u003cbr>类型：纪录长片\u003cbr>片长：90分钟\u003cbr>年份：2026\u003cbr>首映：世界首映\u003cbr>入围：第20届FIRST青年电影展主竞赛单元\u003c/p>\u003cp>FIRST官方影片档案：\u003c/p>\u003cp>https://www.firstfilm.org.cn/movies/film-library/aimeanslove/\u003c/p>\u003cp>\u003ci>\u003cbr>\u003c/i>\u003c/p>\u003cp>\u003ci>\u003cbr>\u003c/i>\u003c/p>\u003cp>\u003ci>注：杨雪在日本使用通称南雪（Minami Yuki）\u003c/i>\u003c/p>","tag":""},"en":{"title":"Documentary Feature AI MEANS LOVE Selected for the Main Competition at the 20th FIRST Young Film Festival","body":"\u003cp>In July 2026, the documentary feature 'Love (AI) and You' (AI MEANS LOVE) was selected for the Main Competition section of the 20th FIRST Young Film Festival, where it had its world premiere. Executive Director Yang Xue attended the festival, held in Xining, China, as a member of the core creative team.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cimg src=\"/assets/images/blog/inline-1792856473313-68e82f.webp\" alt=\"\">\u003c/p>\u003cp>\u003ci style=\"font-size: 14px;\">Photo: The core creative team of 'Love (AI) and You' at the 20th FIRST Young Film Festival. Image source: Official FIRST Young Film Festival.\u003c/i>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>Founded in 2006, the FIRST Young Film Festival is one of China's representative platforms for young filmmakers, long focused on emerging talents with independent creative spirits and a sense of exploration. Since the establishment of the Main Competition section in 2012, FIRST has continuously provided a platform for display and exchange for new generations of film creation through film solicitation, judging, screenings, and industry networking.\u003c/p>\u003cp>This year's festival took place in Xining from July 17 to 25. 'Love (AI) and You' was included in the Main Competition feature list, becoming one of five selected documentary features.\u003c/p>\u003cp>[Image: Official FIRST Main Competition Feature Selection List]\u003c/p>\u003ch3>When AI Becomes a Bridge for Family Bonds\u003c/h3>\u003cp>'Love (AI) and You' is a 90-minute Chinese documentary film.\u003c/p>\u003cp>The film focuses on the real-life experiences of AI designer Hu Renliang. The absence of his father's love was an unhealed scar in his growth process, leaving him with a persistent longing for familial connection.\u003c/p>\u003cp>In 2023, Hu Renliang gained widespread attention for creating an \"AI Grandma.\" He unexpectedly discovered that the image of his grandmother recreated through artificial intelligence technology also moved his father, with whom he had long maintained a distance.\u003c/p>\u003cp>As a result, he decided to create a more refined \"AI Grandma\" 2.0, hoping to use digital technology to repair the nearly broken relationship between father and son.\u003c/p>\u003cp>However, compared to technical implementation itself, years of accumulated family conflicts, differences in values, and emotional trauma constituted even harder barriers to overcome.\u003c/p>\u003cp>Using AI resurrection as an entry point, the film shifts its lens from technical experiments to real human relationships: When technology can recreate the images and voices of deceased loved ones, can it also help living people understand each other again?\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cimg src=\"/assets/images/blog/inline-1792856496195-671b70.webp\" alt=\"\">\u003c/p>\u003cp>\u003cspan style=\"font-size: 14px;\">\u003ci>Photo: Official poster for the film 'Love (AI) and You'.\u003c/i>\u003c/span>\u003cspan style=\"font-size: 14px;\">\u003ci>\u003ca href=\"https://weibo.com/tv/show/1034:5318448939729064\">Watch the trailer.\u003c/a>\u003c/i>\u003c/span>\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>In the overall observation of selected works at this year's FIRST, the intervention of technology in emotions is considered one of the notable creative themes. As artificial intelligence gradually enters the realms of human memory, intimate relationships, and emotional expression, what technology changes is no longer just modes of production and life, but also how people understand and respond to each other.\u003c/p>\u003cp>'Love (AI) and You' provides a specific and subtle perspective on this contemporary issue through the experience of a real family.\u003c/p>\u003ch3>From News Investigation to Documentary Imagery\u003c/h3>\u003cp>Yang Xue joined the core creative team at the invitation of director Qian Yicheng, participating continuously in the film's creation and related production work since the early interview stage of the project.\u003c/p>\u003cp>Prior to this, she worked as a journalist for over ten years at multiple news organizations in China, engaging long-term in investigative reporting, in-depth interviews, and content creation. Subsequently, she founded Senri Dofu Co., Ltd. in Japan, where she currently serves as Representative Director.\u003c/p>\u003cp>From news investigation to documentary imagery, and further to entrepreneurial practice in the field of artificial intelligence, the continuous observation of real people, the investigation and organization of complex information, and the concern for the social impact of technology run through her cross-disciplinary career.\u003c/p>\u003cp>In May 2025, the film, under the title 'Love and You' (All I Want), was selected for FreshPitch Lili True Imaging Conference, with Yang Xue participating in the conference activities as the film's assistant director and project proposer.\u003c/p>\u003cp>In July 2026, the film was completed and selected for the FIRST Main Competition.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cimg src=\"/assets/images/blog/inline-1792856507804-0c5076.webp\" alt=\"\">\u003c/p>\u003cp>\u003cspan style=\"font-size: 14px;\">\u003ci>Photo: The core creative team of 'Love (AI) and You' at the 20th FIRST Young Film Festival. Image source: Official FIRST Young Film Festival.\u003c/i>\u003c/span>\u003c/p>\u003ch3>\u003cbr>\u003c/h3>\u003ch3>Film Information\u003c/h3>\u003cp>Title: 'Love (AI) and You'\u003cbr>English Title: AI MEANS LOVE\u003cbr>Director: Qian Yicheng\u003cbr>Executive Director: Yang Xue (First Assistant Director)\u003cbr>Genre: Documentary Feature\u003cbr>Runtime: 90 minutes\u003cbr>Year: 2026\u003cbr>Premiere: World Premiere\u003cbr>Selection: Main Competition Section, 20th FIRST Young Film Festival\u003c/p>\u003cp>Official FIRST Film Archive:\u003c/p>\u003cp>https://www.firstfilm.org.cn/movies/film-library/aimeanslove/\u003c/p>\u003cp>\u003ci>\u003cbr>\u003c/i>\u003c/p>\u003cp>\u003ci>\u003cbr>\u003c/i>\u003c/p>\u003cp>\u003ci>Note: In Japan, Yang Xue is known by the common name Minami Yuki.\u003c/i>\u003c/p>","tag":""}}</script>
  <script type="module">
    import { bodyToHtml, fitTitle } from '/js/shared/blog-content.js?v=7eeefd1b98';
    const ARTICLE = JSON.parse(document.getElementById('article-data').textContent);
    const titleEl = document.getElementById('article-title');
    function renderArticle(lang) {
      const d = ARTICLE[lang] || ARTICLE.ja;
      titleEl.textContent = d.title;
      fitTitle(titleEl);
      const eb = document.getElementById('article-eyebrow');
      eb.textContent = (d.tag ? d.tag + ' · ' : '') + eb.dataset.date;
      document.getElementById('article-body').innerHTML = bodyToHtml(d.body, window);
      document.title = d.title + ' — ' + (lang === 'en' ? 'Senridoufuu Co., Ltd.' : '千里同風株式会社');
    }
    // 标题一行放不放得下取决于窗口宽度和网页字体（晚到会变宽），这两种时机都重算
    let fitTimer;
    window.addEventListener('resize', () => {
      clearTimeout(fitTimer);
      fitTimer = setTimeout(() => fitTitle(titleEl), 150);
    });
    if (document.fonts) document.fonts.ready.then(() => fitTitle(titleEl));
    const _switchLang = window.switchLang;
    window.switchLang = function (lang) {
      _switchLang(lang);
      renderArticle(lang);
    };
    renderArticle(typeof currentLang === 'string' ? currentLang : 'ja');
  </script>
