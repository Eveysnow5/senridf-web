  <script type="module" src="js/tracking.js?v=5aa1920e9e"></script>
  <script type="application/json" id="article-data">{"ja":{"title":"ドキュメンタリー長編『愛とあなたのあいだ』（All I Want）が2025フレッシュピッチ・黎里ドキュメンタリー映画祭に選出","body":"\u003cp>2025年5月、ドキュメンタリー長編プロジェクト『愛とあなたのあいだ』（All I Want）は2025フレッシュピッチ・黎里ドキュメンタリー映画祭（FreshPitch）に選出され、正式な提案プロジェクトとしてオンサイトピッチや業界交流に参加しました。同作品の副監督である楊雪（千里同風株式会社代表取締役）は、主要クリエイティブチームの一員かつプロジェクト提案者として本イベントに参加しました。\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cimg src=\"/assets/images/blog/inline-1792847648157-fb1ab5.webp\" alt=\"\">\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>フレッシュピッチ（FreshPitch）は2016年に創設された、ドキュメンタリー映像の発見、インキュベーション、業界交流に特化したプラットフォームであり、ドキュメンタリー映像制作者と制作・配給および関連業界のリソース間の協力と交流を促進することを目的としています。\u003cbr>2025年5月、『愛とあなたのあいだ』は大会の投資プロジェクトに選出され、主要クリエイティブチームは江蘇省黎里へ赴き、プロジェクト提案を行い、業界ゲストと作品の創作および今後の展開について交流しました。\u003c/p>\u003ch3>作品について\u003c/h3>\u003cp>『愛とあなたのあいだ』は、人工知能技術が家庭内の感情関係に介入するのをテーマにしたドキュメンタリー長編です。\u003c/p>\u003cp>本作はAIデザイナー胡仁亮の実体験に焦点を当てています。幼少期の父の愛情の欠如により、胡仁亮は親密な絆への執着を抱き続けてきました。2023年、彼が作成した「AIおばあちゃん」は意図せず広範な注目を集め、このデジタルイメージが自分とは長期間疎遠だった父親の心を動かしていることに気づかせました。彼はそこでより完成度の高い「AIおばあちゃん」2.0を作成することを決意し、技術を橋渡し役として父子間の感情的な関係を修復しようと試みました。\u003c/p>\u003cp>本作はこの真実の出来事を起点とし、技術実験と家族関係の複雑な相互作用を継続的に記録するとともに、技術的能力を超えたより答えにくい問題——デジタル化された感情の再構築は、実際の人間が互いを再び理解するのに役立つのか——にカメラを向けています。\u003c/p>\u003cp>\u003cimg src=\"/assets/images/blog/inline-1792847672716-311631.webp\" alt=\"\">\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003ch3>\u003cspan style=\"font-size: 20px;\">調査報道からドキュメンタリー映像へ\u003c/span>\u003c/h3>\u003cp>楊雪は監督銭弈成の招待を受け、プロジェクトの初期インタビュー段階から作品の創作および関連制作業務に継続的に参加しています。\u003c/p>\u003cp>以前、彼女は中国のニュース機関で10年以上にわたり調査報道、人物インタビュー、深掘りコンテンツ制作に従事し、実在の人物と社会の変化に関心を持っていました。今回のドキュメンタリー制作は、技術の発展とその社会的影響に対する彼女の観察を引き継いでいます。\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cimg src=\"/assets/images/blog/inline-1792847715390-7d9c4e.webp\" alt=\"\">\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cspan style=\"font-size: 14px;\">\u003ci>『愛とあなたのあいだ』主要クリエイティブチームが2025フレッシュピッチ・黎里ドキュメンタリー映画祭期間中にプロジェクト交流に参加。画像提供：FreshPitch\u003c/i>\u003c/span>\u003cbr>\u003cimg src=\"/assets/images/blog/inline-1792847749745-6a9384.webp\" alt=\"\">\u003c/p>\u003cp>\u003cspan style=\"font-size: 14px;\">\u003ci>\u003cbr>\u003c/i>\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"font-size: 14px;\">\u003ci>注：本作品は2025年黎里投資段階では暫定英語タイトル All I Want を使用しており、後に正式タイトル AI MEANS LOVE に決定されました。文中の楊雪は日本で通称南雪（Minami Yuki）を使用しています。\u003c/i>\u003c/span>\u003c/p>","tag":""},"zh":{"title":"纪录长片《爱和你之间》（All I Want）入选2025新鲜提案·黎里真实影像大会","body":"\u003cp>2025年5月，纪录长片项目《爱和你之间》（All I Want）入选2025新鲜提案·黎里真实影像大会（FreshPitch），并作为正式提案项目参与现场推介及行业交流。影片副导演杨雪(千里同風株式会社代表取缔役)作为主创团队成员、项目提案人参与本次活动。\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cimg src=\"/assets/images/blog/inline-1792847648157-fb1ab5.webp\" alt=\"\">\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>新鲜提案（FreshPitch）创办于2016年，是聚焦真实影像内容发现、孵化与行业交流的平台，旨在促进纪录影像创作者与制作、发行及相关行业资源之间的交流合作。\u003cbr>2025年5月，《爱和你之间》入选大会创投项目，主创团队赴江苏黎里参与项目提案，与行业嘉宾就影片的创作及后续发展展开交流。\u003c/p>\u003ch3>关于影片\u003c/h3>\u003cp>《爱和你之间》是一部以人工智能技术介入家庭情感关系为主题的纪录长片。\u003c/p>\u003cp>影片聚焦AI设计师胡仁亮的真实经历。因童年时期父爱的缺失，胡仁亮始终怀有对亲情联结的执念。2023年，他制作的「AI奶奶」意外引起广泛关注，也让他发现，这一数字形象触动了与自己长期存在隔阂的父亲。他由此决定制作更加完善的「AI奶奶」2.0，尝试以技术为桥梁，修复父子之间的情感关系。\u003c/p>\u003cp>影片从这一真实事件出发，持续记录技术实验与家庭关系之间的复杂互动，并将镜头对准技术能力之外更难以回答的问题：数字化的情感重建，能否帮助真实的人重新理解彼此？\u003c/p>\u003cp>\u003cimg src=\"/assets/images/blog/inline-1792847672716-311631.webp\" alt=\"\">\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003ch3>\u003cspan style=\"font-size: 20px;\">从调查报道到纪录影像\u003c/span>\u003c/h3>\u003cp>杨雪受导演钱弈成邀请加入影片主创团队，自项目前期采访阶段起持续参与影片创作及相关制作工作。\u003c/p>\u003cp>此前，她曾在中国新闻机构从事十余年调查报道、人物采访与深度内容创作，长期关注真实人物与社会变化。此次纪录片实践延续了其对技术发展及其社会影响的观察。\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cimg src=\"/assets/images/blog/inline-1792847715390-7d9c4e.webp\" alt=\"\">\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cspan style=\"font-size: 14px;\">\u003ci>《爱和你之间》主创团队在2025新鲜提案·黎里真实影像大会期间参与项目交流。图片来源：FreshPitch\u003c/i>\u003c/span>\u003cbr>\u003cimg src=\"/assets/images/blog/inline-1792847749745-6a9384.webp\" alt=\"\">\u003c/p>\u003cp>\u003cspan style=\"font-size: 14px;\">\u003ci>\u003cbr>\u003c/i>\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"font-size: 14px;\">\u003ci>注：影片在2025年黎里创投阶段使用暂定英文片名 All I Want，后正式定名为 AI MEANS LOVE。文中杨雪在日本使用通称南雪（Minami Yuki）。\u003c/i>\u003c/span>\u003c/p>","tag":""},"en":{"title":"Documentary Feature ALL I WANT Selected for the 2025 FreshPitch Lili Documentary Film Festival","body":"\u003cp>In May 2025, the documentary feature project 'Between You and Me' (All I Want) was selected for the 2025 FreshPitch Lili Documentary Film Festival (FreshPitch), participating in on-site pitching and industry exchanges as an official proposal project. Yang Xue (President of Qianli Tongfeng Co., Ltd.), the associate director of the film, participated in this event as a core creative team member and project proposer.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cimg src=\"/assets/images/blog/inline-1792847648157-fb1ab5.webp\" alt=\"\">\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>Founded in 2016, FreshPitch is a platform focused on discovering, incubating, and facilitating industry exchanges for non-fiction content, aiming to promote cooperation and exchange between documentary creators and production, distribution, and related industry resources.\u003cbr>In May 2025, 'Between You and Me' was selected as an investment project at the festival. The core creative team traveled to Lili, Jiangsu, to pitch the project and exchanged views with industry guests regarding the film's creation and future development.\u003c/p>\u003ch3>About the Film\u003c/h3>\u003cp>'Between You and Me' is a documentary feature exploring the theme of artificial intelligence technology intervening in family emotional relationships.\u003c/p>\u003cp>The film focuses on the real-life experience of AI designer Hu Renliang. Due to the absence of his father's love during childhood, Hu has always harbored an obsession with familial connection. In 2023, the 'AI Grandma' he created unexpectedly attracted widespread attention, revealing that this digital persona had touched his father, with whom he had long been estranged. Consequently, he decided to create a more refined 'AI Grandma' 2.0, attempting to use technology as a bridge to repair the emotional relationship between father and son.\u003c/p>\u003cp>Starting from this true event, the film continuously documents the complex interactions between technological experiments and family dynamics, while turning its lens toward questions that are even harder to answer beyond technical capabilities: Can digitally reconstructed emotions help real people understand each other again?\u003c/p>\u003cp>\u003cimg src=\"/assets/images/blog/inline-1792847672716-311631.webp\" alt=\"\">\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003ch3>\u003cspan style=\"font-size: 20px;\">From Investigative Reporting to Documentary\u003c/span>\u003c/h3>\u003cp>Yang Xue joined the core creative team at the invitation of director Qian Yicheng, participating continuously in the film's creation and related production work since the initial interview phase of the project.\u003c/p>\u003cp>Previously, she spent over a decade at Chinese news agencies engaged in investigative reporting, profiling interviews, and in-depth content creation, maintaining a long-term focus on real people and social changes. This documentary practice continues her observation of technological development and its social impacts.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cimg src=\"/assets/images/blog/inline-1792847715390-7d9c4e.webp\" alt=\"\">\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cspan style=\"font-size: 14px;\">\u003ci>The core creative team of 'Between You and Me' participating in project exchanges during the 2025 FreshPitch Lili Documentary Film Festival. Image source: FreshPitch\u003c/i>\u003c/span>\u003cbr>\u003cimg src=\"/assets/images/blog/inline-1792847749745-6a9384.webp\" alt=\"\">\u003c/p>\u003cp>\u003cspan style=\"font-size: 14px;\">\u003ci>\u003cbr>\u003c/i>\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"font-size: 14px;\">\u003ci>Note: During the 2025 Lili investment stage, the film used the provisional English title All I Want, which was later officially named AI MEANS LOVE. In the text, Yang Xue is referred to by her common Japanese name Minami Yuki.\u003c/i>\u003c/span>\u003c/p>","tag":""}}</script>
  <script type="module">
    import { bodyToHtml, fitTitle } from '/js/shared/blog-content.js?v=7eeefd1b98';
    const ARTICLE = JSON.parse(document.getElementById('article-data').textContent);
    const titleEl = document.getElementById('article-title');
    function renderArticle(lang) {
      const d = ARTICLE[lang] || ARTICLE.ja;
      titleEl.textContent = d.title;
      fitTitle(titleEl);
      const eb = document.getElementById('article-eyebrow');
      eb.textContent = (d.tag ? d.tag + ' · ' : '') + eb.dataset.date;
      document.getElementById('article-body').innerHTML = bodyToHtml(d.body, window);
      document.title = d.title + ' — ' + (lang === 'en' ? 'Senridoufuu Co., Ltd.' : '千里同風株式会社');
    }
    // 标题一行放不放得下取决于窗口宽度和网页字体（晚到会变宽），这两种时机都重算
    let fitTimer;
    window.addEventListener('resize', () => {
      clearTimeout(fitTimer);
      fitTimer = setTimeout(() => fitTitle(titleEl), 150);
    });
    if (document.fonts) document.fonts.ready.then(() => fitTitle(titleEl));
    const _switchLang = window.switchLang;
    window.switchLang = function (lang) {
      _switchLang(lang);
      renderArticle(lang);
    };
    renderArticle(typeof currentLang === 'string' ? currentLang : 'ja');
  </script>
