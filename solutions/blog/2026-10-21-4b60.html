  <script type="application/json" id="article-data">{"ja":{"title":"創業者の言葉：AIの幕開けに立つ","body":"\u003cp>機械は人間のように思考できるのか？1950年、アラン・チューリングが世紀の問いを提起した。二進法のデータストリームは、シェイクスピアの十四行詩について人間と議論できるのだろうか？\u003c/p>\n\u003cp>数十年にわたり、コンピュータ技術が飛躍的に発展しても、チューリングテストは依然として越えられない鉄壁のようだった。「いかに機械が発達しても、人間の魂には代わりがない」という見解の下、炭素基生命体はこの鉄壁に何度も挑戦する一方で、この「法則」に近い制約によって保護されてきたのも事実である。\u003c/p>\n\u003cp>2022年、「法則」が緩んだ。\u003c/p>\n\u003cp>この年の11月、ChatGPTがアメリカサンフランシスコで発表された。これにより、一般の人々が初めて大規模に人工知能との開放的な自然言語コミュニケーションの可能性を体験し、それによって今回の生成AIブームの序幕が開かれた。\u003c/p>\n\u003cp>AI知能の発展加速度は人類の予想よりも速かった。2025年2月、AnthropicはClaude Codeの研究プレビュー版を発表し、同年、GPT-4.5は5分間のチューリングテスト調査において、最高73%の評価者がそれを人間だと判断した。\u003c/p>\n\u003cp>\u003ci>「あなたを夏の日に例えることができるだろうか？」&nbsp;\u003c/i>チューリングが70年以上前に論文の中で創作した人間と機械の対話は、ついに紙面から飛び出した。\u003c/p>\n\u003cp>新時代が幕を開け、誰も傍観者ではいられない。これは最良の時代であり、また最悪の時代でもある。人工知能は根本的にすべての人の仕事や生活様式を変革し、同時に平等にすべての人を破壊する可能性もある；そして現在、私たちがみているのはこの大時代の氷山の一角に過ぎない。\u003c/p>\n\u003cp>虚空のシリコンベースの友人を受け入れるかどうかを議論する必要はもうない。私たちが選択すべきことは、どのような姿勢でその到来を迎えるかである。\u003c/p>\n\u003ch2>01\u003c/h2>\n\u003cp>人工知能は効率をもたらしたが、より多くの不公平ももたらした。\u003c/p>\n\u003cp>テック大手たちは歓喜している。歴史上、わずか数年間で時価総額が1000億ドルを超える企業がこれほど多く出現した時代はない；テック大手は人員削減も行っており、インターネット大手企業は単位を「万」にして、中核プログラマーを大量に解雇している：「AIはあなたの技術をすでに学んだ、あなたは帰っていい。省いたお金でさらに多くのGPUを購入するのだ。」\u003c/p>\n\u003cp>学生たちも歓喜している、指導教員は支持していないものの、AIが卒業論文の執筆を手伝ってくれるため、煩雑で反復的な基礎作業が学術や仕事の障害にならなくなった；しかし学生たちは悩みも抱えている、採用企業は敏鋭にAIが多くの基礎ポジションを代替可能であることを発見し、新卒者の採用基準を「3年の実務経験」まで引き上げた。伝統的な技術継承のための有給修業の経路は、今や徐々に閉塞しつつある。\u003c/p>\n\u003cp>多くの業界において、トップクラスの従事者は依然として代替不可能だが、まだTOPになることができていない新人たちは、AIの衝撃の下で、一歩ずつ千里に至る可能性を徐々に失いつつある。会社も競合他社もあなたの成長を待ってはくれないが、AIが直接灌輸したものを実際に掌握し活用できるかは保証されない。\u003c/p>\n\u003ch2>02\u003c/h2>\n\u003cp>千里同風（センリドウフウ）のチームは中国出身で、かつて伝統的な新聞メディアや金融産業の従事者として市場で活躍してきた。不況と繁栄の周期を乗り越え、私たちは各分野で先導的な成績を収め、グローバルな視野と15年以上の特定業界での実務経験を備えた。これらの蓄積により、人工知能技術が提供するレバレッジを十分に活用し、最先端技術を日常生活に落とし込み、一般の人々にサービスを提供することが可能となった。\u003c/p>\n\u003cp>私たちは以下の観点を持っている：\u003c/p>\n\u003cp>人工知能について：人工知能は新しい世代の産業革命であり、受け入れなければならない生産性の変革である；一方で、人工知能は大量の社会的問題を引き起こすため、リスク防止と対応に特別な注意を払う必要がある。個人であれ団体であれ、この人類社会と歴史を変える変革に積極的に向き合い、人工知能ツールを応用する能力を身につけるべきである。\u003c/p>\n\u003cp>グローバル化について：グローバル化は第二次世界大戦後、各国の発展と進歩の主要な原動力であり、国際貿易は知識、資源、労働力の国境を越えた移動をもたらし、各国に繁栄をもたらした；重大な課題に直面していても、コミュニケーション、理解、協力こそがグローバル化を守る唯一の道である。\u003c/p>\n\u003cp>独立した思考について：私たちは世界は複雑であり、絶対的な正しさや誤りは識別・検証が難しいと考えているが、前提となる立場を捨て、客観的証拠に基づいて判断することは、世界を理解するためのより有効な方法である。AI技術は情報格差を縮小するための有効な技術手段の一つである。\u003c/p>\n\u003cp>権力について：技術はすなわち権力である。前例のない技術は、前例のない権力を意味する。権力が少数の中心に集中するこの時代において、完全な制度的監視と抑制のほかに、技術自体への深い理解と積極的な使用は、個人が自己の権利利益を守る重要な方法と経路である。\u003c/p>\n\u003cp>平等について：千里同風（センリドウフウ）の最も核心的な製品設計の宗旨は、\u003cstrong>ユーザーが可能な限り余計な学習コストをかけずに、AIツールをより迅速かつ正確に掌握すること\u003c/strong>である。これは単なる効率向上やユーザー体験の問題だけでなく、\u003cstrong>技術が生む不平等に対抗する努力\u003c/strong>でもある。\u003c/p>\n\u003cp>2025年2月25日、AnthropicがClaude Codeを発表した翌日、千里同風株式会社は日本大阪で設立された。私たちはこの伝統文化と最先端技術が共存する都市を選び、新たな人生段階を開始した；また、この急速に変化する大時代において、私たちの仕事を통じて、一般の人々にも人工知能を柔軟に活用できるようにし、先進的生産力の平等な応用を促進したいと考えている。\u003c/p>\n\u003cp>潮頭に伴い生まれ、時代とともに舞う。\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cbr>\u003c/p>\n\u003cp>\u003cspan style=\"font-size: 14px;\">本稿は完全に手打ちであり、AIによる代筆はない。\u003c/span>\u003c/p>"},"zh":{"title":"创始人语：站在AI开幕之时","body":"\u003cp>机器是否能像人一样思考？1950年，艾伦·图灵提出世纪之问：二进制的数据流，能否和人类讨论莎士比亚的十四行诗？\u003c/p>\n\u003cp>在数十年里，即使计算机科技发展日新月异，图灵测试始终是一道似乎无法逾越的铁壁。“无论机器如何发达，人类灵魂无可替代。”在这样的观点下，碳基生命一边无数次对这个铁壁发起挑战，一边也确实被这种近乎“法则”的约束所保护。\u003c/p>\n\u003cp>2022年，“法则”松动了。\u003c/p>\n\u003cp>这一年11月，ChatGPT在美国旧金山市发布。它让普通人第一次大规模地体验到与人工智能进行开放式自然语言交流的可能，并由此拉开了本轮生成式人工智能浪潮的序幕。\u003c/p>\n\u003cp>AI智能发展的加速度比人类预想得更快。2025年2月，Anthropic发布Claude Code研究预览版，同一年，GPT-4.5在一项五分钟图灵测试研究中，最高有73%的比例被评判者当成人类。\u003c/p>\n\u003cp>\u003ci>“我能否将你比作夏日？”&nbsp;\u003c/i>图灵在70多年前于论文中虚构的人机对话终于走出纸面。\u003c/p>\n\u003cp>新时代拉开序幕，无人能置身事外。这是最好的时代，这也是最坏的时代。人工智能从根本上改变着每一个人的工作和生活方式，也可能平等地毁灭每一个人；而目前，我们只能看到这个大时代的冰山一角。\u003c/p>\n\u003cp>已无须讨论是否要拥抱虚空中的硅基朋友，我们需要做出选择的是：用什么样的姿势，去迎接它的到来。\u003c/p>\n\u003ch2>01\u003c/h2>\n\u003cp>人工智能带来了效率，也带来了更多的不公平。\u003c/p>\n\u003cp>科技巨头们在狂欢。历史上没有任何一个时期，在短短几年中涌现出这么多估值超过千亿美元的公司；科技巨头们也在裁员，互联网大厂以万为单位，将骨干程序员成批遣散：“AI已经学会了你的技术，你可以回家了。我们要用省下来的钱采购更多的GPU。”\u003c/p>\n\u003cp>学生们在狂欢，虽然导师并不支持，但AI可以帮忙写毕业论文了，繁琐重复的基础工作不再成为学术和工作的障碍；学生们也在困扰，用人企业敏锐地发现AI已经可以替代许多基础职位，对应届生的招聘要求提高到“三年工作经验”。传统技术传承的带薪学艺路径，如今已慢慢堵塞。\u003c/p>\n\u003cp>在许多行业，顶尖的从业人员仍然不可替代，但尚未来得及成为TOP的新手，正在AI的冲击下，逐渐丧失积跬步以致千里的可能性。公司与竞争对手都不会等待你成长，但AI直接灌输的东西你未必能真的掌握和运用。\u003c/p>\n\u003ch2>02\u003c/h2>\n\u003cp>千里同風的团队来自中国，曾作为传统的新闻媒体和金融产业从业者活跃在市场上。跨越过萧条和繁荣的周期，我们均在所在领域取得了领先的成绩，并具备了全球化的视野和超过十五年的细分行业从业经验。这些积累使我们能够充分利用人工智能技术提供的杠杆，将前沿技术落实到日常生活，为普通人服务。\u003c/p>\n\u003cp>我们持有如下观点：\u003c/p>\n\u003cp>关于人工智能：人工智能是新一代工业革命，是必须要拥抱的生产力变革；另一方面，人工智能会带来大量的社会问题，需要特别重视风险防范和应对。无论个人还是团体，都应当积极面对这场改变人类社会和历史的变革，掌握应用人工智能工具的能力。\u003c/p>\n\u003cp>关于全球化：全球化是二战后各国发展和进步的主要动力，跨国贸易使知识、资源和劳动力跨国流动，为各国带来了繁荣；纵使面临着重大挑战，沟通、理解与协作仍然是保护全球化的唯一路径。\u003c/p>\n\u003cp>关于独立思考：我们认为世界是复杂的，绝对的正确或者错误可能很难识别和验证，但摒弃预设立场，基于客观证据做出判断，是更有效的认识世界的方法。AI技术是缩小信息差的有效技术手段之一。\u003c/p>\n\u003cp>关于权力：技术即权力。空前的技术也意味着空前的权力。在这个权力向少数几个中心集中的时代，除了完善的制度监督和制衡，对技术本身的深入理解与积极使用，是个体维护自我权益的重要方式和途径。\u003c/p>\n\u003cp>关于平等：千里同風最核心的产品设计宗旨即是，\u003cstrong>让用户尽可能没有多余学习成本地，更快速准确地掌握AI工具\u003c/strong>。这不仅仅关乎效率提高和用户使用感受，更是\u003cstrong>对抗技术带来不平等的努力\u003c/strong>。\u003c/p>\n\u003cp>在2025年2月25日，Anthropic发布Claude Code的第二天，千里同風株式会社在日本大阪成立。我们选择这个传统文化与前沿技术并存的城市，开始了新的人生阶段；也希望在这个快速变化的大时代里，通过我们的工作，让普通人也能够灵活运用人工智能，促进先进生产力的平等应用。\u003c/p>\n\u003cp>伴潮头而生，与时代共舞。\u003c/p>\n\u003cp>\u003cspan style=\"font-size: 14px;\">\u003cbr>\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"font-size: 14px;\">\u003cbr>\u003c/span>\u003c/p>\u003cp>\u003cspan style=\"font-size: 14px;\">（本文纯原创，AI未捉刀）\u003c/span>\u003c/p>"},"en":{"title":"Founder's Words: Standing at the Dawn of AI","body":"\u003cp>Can machines think like humans? In 1950, Alan Turing posed the question of the century: Can a stream of binary data discuss Shakespeare's sonnets with human beings?\u003c/p>\n\u003cp>For decades, even as computer technology evolved by leaps and bounds, the Turing test remained an insurmountable iron wall. Under the view that \"no matter how advanced machines become, the human soul is irreplaceable,\" carbon-based life forms have repeatedly challenged this iron wall while simultaneously being protected by this near-\"law\" constraint.\u003c/p>\n\u003cp>In 2022, the \"law\" loosened.\u003c/p>\n\u003cp>In November of that year, ChatGPT was released in San Francisco, USA. It allowed ordinary people to experience for the first time on a large scale the possibility of open-ended natural language interaction with artificial intelligence, thereby launching the curtain of the current wave of generative AI.\u003c/p>\n\u003cp>The acceleration of AI intelligence development has been faster than humans anticipated. In February 2025, Anthropic released the research preview of Claude Code; in the same year, GPT-4.5 was judged as human by up to 73% of evaluators in a five-minute Turing test study.\u003c/p>\n\u003cp>\u003ci>\"Shall I compare thee to a summer's day?\"&nbsp;\u003c/i>The dialogue between man and machine that Turing fictionalized in his paper more than 70 years ago has finally stepped off the page.\u003c/p>\n\u003cp>A new era has begun, and no one can remain a bystander. This is the best of times, and it is the worst of times. Artificial intelligence is fundamentally changing everyone's work and lifestyle, and may equally destroy everyone; currently, we can only see the tip of the iceberg of this great era.\u003c/p>\n\u003cp>There is no longer a need to discuss whether to embrace our silicon-based friends in the void. What we need to choose is: in what posture shall we welcome its arrival?\u003c/p>\n\u003ch2>01\u003c/h2>\n\u003cp>Artificial intelligence brings efficiency, but also greater inequality.\u003c/p>\n\u003cp>Tech giants are reveling. In history, there has never been a period where so many companies with valuations exceeding $100 billion emerged in just a few years; tech giants are also laying off workers, with major internet companies dismissing core programmers in batches by the tens of thousands: \"AI has already learned your skills, you can go home. We will use the saved money to purchase more GPUs.\"\n\u003c/p>\u003cp>Students are celebrating; although their supervisors do not support it, AI can help write graduation theses, and tedious, repetitive basic work no longer becomes an obstacle to academia or work; students are also troubled, as hiring companies have keenly discovered that AI can replace many basic positions, raising recruitment requirements for fresh graduates to \"three years of work experience.\" The traditional path of paid apprenticeship for technical inheritance is now gradually blocked.\u003c/p>\n\u003cp>In many industries, top practitioners remain irreplaceable, but newcomers who have not yet reached the TOP level are gradually losing the possibility of accumulating steps to reach a thousand miles under the impact of AI. Companies and competitors will not wait for you to grow, but what AI directly instills into you is not necessarily something you can truly master and apply.\u003c/p>\n\u003ch2>02\u003c/h2>\n\u003cp>The team behind Qianli Tongfeng (Senri Doufu) comes from China and has been active in the market as traditional news media and financial industry professionals. Having crossed cycles of depression and prosperity, we have all achieved leading results in our respective fields and possess a global perspective and over fifteen years of experience in specialized industries. These accumulations enable us to fully leverage the leverage provided by artificial intelligence technology, implementing cutting-edge technology into daily life to serve ordinary people.\u003c/p>\n\u003cp>We hold the following views:\u003c/p>\n\u003cp>On Artificial Intelligence: AI is a new generation of industrial revolution and a productivity transformation that must be embraced; on the other hand, AI will bring about numerous social issues, requiring special attention to risk prevention and response. Whether individuals or groups, they should actively face this transformation that changes human society and history, and master the ability to apply AI tools.\u003c/p>\n\u003cp>On Globalization: Globalization has been the main driving force for development and progress in countries since World War II; international trade enables the cross-border flow of knowledge, resources, and labor, bringing prosperity to various countries; despite facing significant challenges, communication, understanding, and cooperation remain the only path to protecting globalization.\u003c/p>\n\u003cp>On Independent Thinking: We believe the world is complex, and absolute right or wrong may be difficult to identify and verify, but abandoning pre-established positions and making judgments based on objective evidence is a more effective way to understand the world. AI technology is one of the effective technical means to narrow the information gap.\u003c/p>\n\u003cp>On Power: Technology is power. Unprecedented technology means unprecedented power. In this era where power concentrates in a few centers, besides perfect institutional supervision and checks and balances, deep understanding and active use of technology itself are important ways and paths for individuals to maintain their own rights and interests.\u003c/p>\n\u003cp>On Equality: The most core product design principle of Qianli Tongfeng (Senri Doufu) is to \u003cstrong>enable users to master AI tools more quickly and accurately with minimal additional learning costs\u003c/strong>. This is not only about improving efficiency and user experience, but also an \u003cstrong>effort to counter the inequality brought by technology\u003c/strong>.\u003c/p>\n\u003cp>On February 26, 2025, the day after Anthropic released Claude Code, Qianli Tongfeng Co., Ltd. was established in Osaka, Japan. We chose this city where traditional culture and cutting-edge technology coexist to begin a new stage in life; we also hope that in this rapidly changing era, through our work, ordinary people can flexibly utilize artificial intelligence, promoting the equal application of advanced productive forces.\u003c/p>\n\u003cp>Born with the tide, dancing with the times.\u003c/p>\u003cp>\u003cbr>\u003c/p>\u003cp>\u003cbr>\u003c/p>\n\u003cp>\u003cspan style=\"font-size: 14px;\">This article was typed entirely by hand; AI did not ghostwrite it.\u003c/span>\u003c/p>"}}</script>
